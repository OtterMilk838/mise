<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve on iPhone -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Your pantry, shopping list, and what you can cook right now.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAF6F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17130F" media="(prefers-color-scheme: dark)">
<!-- Home-screen behaviour on iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mise">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%0A%20%20%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%23FAF6F0%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M50%2030%20L66%2074%20Q50%2084%2034%2074%20Z%22%20fill%3D%22%23C4633F%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M50%2032%20V18%20M50%2024%20L40%2014%20M50%2024%20L60%2014%22%20stroke%3D%22%236B7A4B%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%2F%3E%0A%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%0A%20%20%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%23FAF6F0%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M50%2030%20L66%2074%20Q50%2084%2034%2074%20Z%22%20fill%3D%22%23C4633F%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M50%2032%20V18%20M50%2024%20L40%2014%20M50%2024%20L60%2014%22%20stroke%3D%22%236B7A4B%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%2F%3E%0A%3C%2Fsvg%3E">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* Minimal reset — the artifact host normally provides one. */
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
</style>
</head>
<body>
<title>Mise</title>

<style>
  /* ── Tokens ────────────────────────────────────────────────────────────
     Light is the complete palette on bare :root. Dark redefines only the
     token values, twice: once for the un-stamped system-dark case and once
     for an explicit toggle. No component color is ever declared inside a
     media or [data-theme] block. */
  :root {
    --ground:      #FAF6F0;
    --surface:     #FFFFFF;
    --surface-alt: #F3EDE4;
    --ink:         #2A2521;
    --ink-muted:   #7A6E63;
    --ink-faint:   #A2958A;
    --line:        #E8DFD3;
    --accent:      #C4633F;
    --accent-ink:  #FFFFFF;
    --accent-soft: #F6E4DB;
    --have:        #6B7A4B;
    --short:       #C08018;
    --missing:     #B44A3A;
    --unverified:  #A88A4C;
    --shadow:      0 1px 2px rgba(42, 37, 33, .06), 0 8px 24px rgba(42, 37, 33, .06);
    --sheet-scrim: rgba(42, 37, 33, .38);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:      #17130F;
      --surface:     #221D18;
      --surface-alt: #2B241E;
      --ink:         #F2EBE2;
      --ink-muted:   #A89A8C;
      --ink-faint:   #7C7065;
      --line:        #352C25;
      --accent:      #E4835B;
      --accent-ink:  #1B1611;
      --accent-soft: #3A2820;
      --have:        #9CB26E;
      --short:       #E0A63F;
      --missing:     #E08267;
      --unverified:  #C4A468;
      --shadow:      0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .34);
      --sheet-scrim: rgba(0, 0, 0, .6);
    }
  }

  :root[data-theme="dark"] {
    --ground:      #17130F;
    --surface:     #221D18;
    --surface-alt: #2B241E;
    --ink:         #F2EBE2;
    --ink-muted:   #A89A8C;
    --ink-faint:   #7C7065;
    --line:        #352C25;
    --accent:      #E4835B;
    --accent-ink:  #1B1611;
    --accent-soft: #3A2820;
    --have:        #9CB26E;
    --short:       #E0A63F;
    --missing:     #E08267;
    --unverified:  #C4A468;
    --shadow:      0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .34);
    --sheet-scrim: rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }

  button, input, select, textarea {
    font: inherit;
    color: inherit;
  }

  /* Kills the double-tap-to-zoom delay, so hammering +/- adjusts a quantity
     instead of zooming the page. `manipulation` still permits pinch-zoom —
     unlike user-scalable=no, which would take that away from anyone who
     needs it to read the screen. */
  body,
  button,
  .tab,
  .chip,
  .check,
  .row,
  .stepper button,
  .segment button {
    touch-action: manipulation;
  }

  /* Also stop iOS selecting label text on a fast double tap of a control. */
  button, .tab, .chip, .check, .stepper, .segment {
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* ── App shell ─────────────────────────────────────────────────────── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 640px;
    margin: 0 auto;
    background: var(--ground);
  }

  .topbar {
    flex: none;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) 20px 12px;
    background: var(--ground);
  }

  .wordmark {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -.02em;
    margin: 0;
  }

  .topbar-sub {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  .view {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 4px 0 24px;
  }

  .view[hidden] { display: none; }

  /* ── Bottom tab bar ────────────────────────────────────────────────── */
  .tabbar {
    flex: none;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--line);
    background: var(--surface);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .tab {
    appearance: none;
    border: 0;
    background: none;
    padding: 9px 4px 8px;
    min-height: 54px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--ink-muted);
    cursor: pointer;
  }

  .tab svg { width: 23px; height: 23px; }

  .tab-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .01em;
  }

  .tab[aria-selected="true"] { color: var(--accent); }

  .tab-badge {
    position: absolute;
    transform: translate(14px, -4px);
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 99px;
    font-variant-numeric: tabular-nums;
  }

  /* ── Storage alarm ─────────────────────────────────────────────────── */
  .alarm {
    flex: none;
    margin: 0 20px 10px;
    padding: 13px 15px;
    border-radius: 13px;
    background: color-mix(in srgb, var(--missing) 12%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--missing) 34%, transparent);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .alarm[hidden] { display: none; }
  .alarm strong { display: block; font-size: 14.5px; color: var(--missing); margin-bottom: 3px; }
  .alarm p { margin: 0; font-size: 13px; line-height: 1.4; color: var(--ink-muted); }
  .alarm .btn { flex: none; width: auto; padding: 0 14px; min-height: 42px; font-size: 14px; }

  /* ── Toolbar (segmented control + add) ─────────────────────────────── */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 4px 20px 12px;
  }

  .segment {
    display: flex;
    background: var(--surface-alt);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }

  .segment button {
    appearance: none;
    border: 0;
    background: none;
    border-radius: 8px;
    padding: 0 13px;
    min-height: 34px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-muted);
    cursor: pointer;
    white-space: nowrap;
  }

  .segment button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
  }

  .icon-btn {
    appearance: none;
    border: 0;
    width: 46px;
    height: 46px;
    flex: none;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: var(--shadow);
  }

  .icon-btn svg { width: 24px; height: 24px; }

  .icon-btn-quiet {
    background: var(--surface);
    color: var(--ink-muted);
    box-shadow: none;
    border: 1px solid var(--line);
    width: 42px;
    height: 42px;
  }
  .icon-btn-quiet svg { width: 20px; height: 20px; }

  /* ── Section headings ──────────────────────────────────────────────── */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 18px 20px 7px;
  }

  .section-head h2 {
    margin: 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .section-count {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  /* ── Rows ──────────────────────────────────────────────────────────── */
  .rows { display: flex; flex-direction: column; gap: 7px; padding: 0 20px; }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border-radius: 13px;
    min-height: 58px;
    padding-left: 15px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  /* Severity stripe: state readable before you parse the text. */
  .row[data-state]::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 4px;
  }
  .row[data-state="have"]::before       { background: var(--have); }
  .row[data-state="short"]::before      { background: var(--short); }
  .row[data-state="missing"]::before    { background: var(--missing); }
  .row[data-state="unverified"]::before { background: var(--unverified); }
  .row[data-state="unmatched"]::before  { background: var(--ink-faint); }

  .row-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    padding: 9px 0;
    background: none;
    border: 0;
    text-align: left;
    cursor: pointer;
    align-self: stretch;
  }

  .row-name {
    font-size: 16px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Already copied into your own recipes. */
  .row-name[data-owned]::after {
    content: "in my recipes";
    display: inline-block;
    margin-left: 8px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--accent);
    vertical-align: middle;
  }

  .row-sub {
    font-size: 12.5px;
    color: var(--ink-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .row-note {
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 500;
  }

  /* ── Stepper ───────────────────────────────────────────────────────── */
  .stepper { display: flex; align-items: center; flex: none; }

  .stepper button {
    appearance: none;
    border: 0;
    background: none;
    width: 44px;
    height: 46px;
    border-radius: 9px;
    color: var(--accent);
    display: grid;
    place-items: center;
    cursor: pointer;
  }

  .stepper button:active { background: var(--surface-alt); }
  .stepper svg { width: 19px; height: 19px; }

  .stepper-value {
    min-width: 62px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .stepper-unit { font-size: 12px; font-weight: 500; color: var(--ink-muted); }

  /* Batch counts are single digits — reclaim the width for the recipe title. */
  .stepper-compact button { width: 38px; }
  .stepper-compact .stepper-value { min-width: 20px; }

  /* ── Checkbox (shopping list) ──────────────────────────────────────── */
  .check {
    appearance: none;
    border: 0;
    background: none;
    width: 52px;
    align-self: stretch;
    display: grid;
    place-items: center;
    cursor: pointer;
    flex: none;
  }

  .check-box {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    border: 2px solid var(--line);
    display: grid;
    place-items: center;
    color: transparent;
  }

  .check[aria-checked="true"] .check-box {
    background: var(--have);
    border-color: var(--have);
    color: #fff;
  }

  .check-box svg { width: 15px; height: 15px; }

  .row.is-checked .row-name { text-decoration: line-through; color: var(--ink-faint); }

  /* ── Chips / pills ─────────────────────────────────────────────────── */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 99px;
    background: var(--surface-alt);
    color: var(--ink-muted);
    white-space: nowrap;
  }

  .pill[data-state="have"]       { background: color-mix(in srgb, var(--have) 16%, transparent);       color: var(--have); }
  .pill[data-state="short"]      { background: color-mix(in srgb, var(--short) 18%, transparent);      color: var(--short); }
  .pill[data-state="missing"]    { background: color-mix(in srgb, var(--missing) 15%, transparent);    color: var(--missing); }
  .pill[data-state="unverified"] { background: color-mix(in srgb, var(--unverified) 18%, transparent); color: var(--unverified); }

  .chips {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 3px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }

  .chip {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 9px;
    padding: 0 13px;
    min-height: 40px;
    font-size: 14px;
    color: var(--ink-muted);
    cursor: pointer;
    white-space: nowrap;
    flex: none;
  }

  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }

  /* ── Empty state ───────────────────────────────────────────────────── */
  .empty {
    padding: 56px 40px;
    text-align: center;
    color: var(--ink-muted);
  }

  .empty h3 {
    margin: 0 0 6px;
    font-size: 18px;
    font-weight: 650;
    color: var(--ink);
  }

  .empty p { margin: 0; font-size: 15px; line-height: 1.5; }

  /* ── Sheet ─────────────────────────────────────────────────────────── */
  .scrim {
    position: fixed;
    inset: 0;
    background: var(--sheet-scrim);
    z-index: 40;
  }

  .scrim[hidden], .sheet[hidden], .cook[hidden] { display: none; }

  .sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 100%;
    max-width: 640px;
    max-height: 92dvh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    border-radius: 20px 20px 0 0;
    z-index: 50;
    box-shadow: 0 -8px 40px rgba(0, 0, 0, .22);
    animation: rise .22s cubic-bezier(.32, .72, 0, 1);
  }

  @keyframes rise { from { transform: translate(-50%, 100%); } }

  .sheet-head {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 10px;
    border-bottom: 1px solid var(--line);
  }

  .sheet-head h2 { margin: 0; font-size: 19px; font-weight: 700; }

  .sheet-body { overflow-y: auto; padding: 16px 20px; }

  .sheet-foot {
    flex: none;
    display: flex;
    gap: 10px;
    padding: 12px 20px max(14px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }

  .btn {
    appearance: none;
    border: 0;
    flex: 1;
    min-height: 48px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    background: var(--surface);
    color: var(--ink-muted);
  }

  .btn-primary { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .btn-danger  { background: none; color: var(--missing); }
  .btn:disabled { opacity: .45; cursor: default; }

  /* ── Form fields ───────────────────────────────────────────────────── */
  .field { margin-bottom: 17px; }

  .field > label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 6px;
  }

  .input, textarea.input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 12px 14px;
    min-height: 48px;
    font-size: 16px; /* 16px avoids iOS zoom-on-focus */
    color: var(--ink);
  }

  textarea.input { min-height: 120px; resize: vertical; line-height: 1.5; font-family: inherit; }

  .input::placeholder { color: var(--ink-faint); }

  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .hint { font-size: 12.5px; color: var(--ink-faint); margin-top: 6px; }

  .howto {
    margin: 0;
    padding-left: 20px;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--ink-muted);
  }
  .howto li { margin-bottom: 5px; }
  .howto strong { color: var(--ink); }

  /* ── Recipe detail ─────────────────────────────────────────────────── */
  .recipe-head { padding: 6px 20px 4px; }

  .recipe-title { margin: 0 0 5px; font-size: 25px; font-weight: 750; letter-spacing: -.015em; text-wrap: balance; }

  .recipe-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-muted); }

  .linkish {
    appearance: none;
    border: 0;
    background: none;
    padding: 0;
    color: var(--accent);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .scale-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 12px 20px 2px;
    padding: 10px 8px 10px 15px;
    background: var(--surface);
    border-radius: 13px;
    box-shadow: var(--shadow);
  }

  .scale-label { display: block; font-size: 16px; font-weight: 600; }
  .scale-note { display: block; font-size: 12.5px; color: var(--ink-muted); margin-top: 1px; }

  .scale-reset {
    min-width: 42px;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  .summary-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 12px 20px 4px;
  }

  .steps { counter-reset: step; padding: 0 20px; margin: 0; list-style: none; }

  .steps li {
    counter-increment: step;
    position: relative;
    padding: 0 0 16px 34px;
    font-size: 15.5px;
    line-height: 1.5;
  }

  .steps li::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 1px;
    width: 23px;
    height: 23px;
    border-radius: 50%;
    background: var(--surface-alt);
    color: var(--ink-muted);
    font-size: 12px;
    font-weight: 700;
    display: grid;
    place-items: center;

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   DOMAIN — ported from src/domain/*.ts. Pure functions, no DOM access.
   These carry over unchanged from the React Native build because they
   never imported React or SQLite.
   ══════════════════════════════════════════════════════════════════════ */

/* ---- units ---------------------------------------------------------- */
const UNITS = {
  count: { dim: 'count',  k: 1,               aliases: ['count','ct','each','ea','pc','pcs','piece','pieces','x'] },
  g:     { dim: 'mass',   k: 1,               aliases: ['g','gm','gr','gram','grams'] },
  kg:    { dim: 'mass',   k: 1000,            aliases: ['kg','kilo','kilos','kilogram','kilograms'] },
  oz:    { dim: 'mass',   k: 28.349523125,    aliases: ['oz','ounce','ounces'] },
  lb:    { dim: 'mass',   k: 453.59237,       aliases: ['lb','lbs','pound','pounds'] },
  ml:    { dim: 'volume', k: 1,               aliases: ['ml','milliliter','milliliters','millilitre','millilitres','cc'] },
  l:     { dim: 'volume', k: 1000,            aliases: ['l','liter','liters','litre','litres'] },
  tsp:   { dim: 'volume', k: 4.92892159375,   aliases: ['tsp','teaspoon','teaspoons'] },
  tbsp:  { dim: 'volume', k: 14.78676478125,  aliases: ['tbsp','tbs','tablespoon','tablespoons'] },
  cup:   { dim: 'volume', k: 236.5882365,     aliases: ['cup','cups','c'] },
  floz:  { dim: 'volume', k: 29.5735295625,   aliases: ['floz','fl oz','fl. oz','fluid ounce','fluid ounces'] },
  pt:    { dim: 'volume', k: 473.176473,      aliases: ['pt','pint','pints'] },
  qt:    { dim: 'volume', k: 946.352946,      aliases: ['qt','quart','quarts'] },
  gal:   { dim: 'volume', k: 3785.411784,     aliases: ['gal','gallon','gallons'] },
};

const ALL_UNITS = Object.keys(UNITS);

const ALIAS_TO_UNIT = new Map();
for (const [u, def] of Object.entries(UNITS)) {
  for (const a of def.aliases) ALIAS_TO_UNIT.set(a, u);
}

function parseUnit(raw) {
  const t = String(raw || '').trim().replace(/\.$/, '');
  if (!t) return null;
  if (t === 'T') return 'tbsp';   // bare T is tablespoon,
  if (t === 't') return 'tsp';    // bare t is teaspoon — case matters
  return ALIAS_TO_UNIT.get(t.toLowerCase()) || null;
}

const dimensionOf = (u) => UNITS[u].dim;
const toCanonical = (q, u) => q * UNITS[u].k;

function convert(q, from, to) {
  if (from === to) return q;
  if (dimensionOf(from) !== dimensionOf(to)) return null;
  return toCanonical(q, from) / UNITS[to].k;
}

function formatQuantity(q) {
  const r = Math.round(q * 100) / 100;
  return String(r);
}

/* ---- density -------------------------------------------------------- */
/* Grams per millilitre, for volume <-> mass comparison. */
const DENSITY = {
  water: 1, milk: 1.03, cream: 1.0, buttermilk: 1.03, yogurt: 1.03,
  oil: 0.918, 'olive oil': 0.918, 'vegetable oil': 0.92, butter: 0.911,
  honey: 1.42, syrup: 1.37, 'maple syrup': 1.32, molasses: 1.4,
  flour: 0.53, 'all purpose flour': 0.53, 'bread flour': 0.55, 'whole wheat flour': 0.51,
  sugar: 0.845, 'brown sugar': 0.93, 'powdered sugar': 0.56,
  salt: 1.22, rice: 0.85, oat: 0.41, oats: 0.41, cornmeal: 0.67,
  cocoa: 0.53, 'cocoa powder': 0.53, cornstarch: 0.63,
  lentil: 0.85, bean: 0.8, 'peanut butter': 1.08,
  almond: 0.6, walnut: 0.52, pecan: 0.5,
  'baking powder': 0.9, 'baking soda': 1.0,
};

/* Grams per single item, for count <-> mass comparison. */
const PIECE_WEIGHT = {
  egg: 50, onion: 150, garlic: 5, 'garlic clove': 5, potato: 170, tomato: 120,
  carrot: 60, lemon: 100, lime: 65, apple: 180, banana: 120, avocado: 200,
  pepper: 120, cucumber: 300, 'chicken breast': 175, shallot: 40, celery: 40,
};

/* ---- normalize ------------------------------------------------------ */
/* Descriptor list chosen by the user: size, cut and quality words are
   stripped. State words (fresh/frozen/dried/ripe/ground) are deliberately
   NOT stripped — dried basil is not fresh basil, and collapsing them causes
   the expensive failure of claiming you have something you don't. */
const DESCRIPTORS = new Set([
  'large','medium','small','extra','jumbo',
  'chopped','minced','diced','sliced','shredded','whole',
  'organic','boneless','skinless','unsalted','plain',
]);

const INVARIANT = new Set([
  'molasses','hummus','couscous','asparagus','watercress','swiss',
  'bass','grass','cress','gas',
]);

const IRREGULAR = { leaves: 'leaf', loaves: 'loaf', halves: 'half', knives: 'knife' };

function singularize(w) {
  if (INVARIANT.has(w)) return w;
  if (IRREGULAR[w]) return IRREGULAR[w];
  if (w.length <= 3) return w;
  if (w.endsWith('ies')) return w.slice(0, -3) + 'y';
  if (w.endsWith('ves')) return w.slice(0, -3) + 'f';
  if (w.endsWith('oes')) return w.slice(0, -2);
  if (w.endsWith('ss') || w.endsWith('us') || w.endsWith('is')) return w;
  if (w.endsWith('s')) return w.slice(0, -1);
  return w;
}

function splitPrep(raw) {
  const i = raw.indexOf(',');
  if (i === -1) return { name: raw.trim(), prep: null };
  return { name: raw.slice(0, i).trim(), prep: raw.slice(i + 1).trim() || null };
}

function normalizeName(raw) {
  const noParens = String(raw || '').replace(/\([^)]*\)/g, ' ');
  const { name } = splitPrep(noParens);
  const tokens = name.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean);
  // Drop leading standalone numbers: "2 tomatoes" typed into a name field
  // would otherwise key as "2 tomato" and match nothing. "7up" keeps its digit.
  while (tokens.length > 1 && /^\d+$/.test(tokens[0])) tokens.shift();
  if (!tokens.length) return '';
  const kept = tokens.filter((t) => !DESCRIPTORS.has(t));
  return (kept.length ? kept : tokens).map(singularize).join(' ');
}

/* ---- categorize ----------------------------------------------------- */
const ALL_CATEGORIES = ['produce','meat & seafood','dairy & eggs','bakery','frozen','pantry','spices','beverages','household','other'];

const KEYWORDS = {
  onion:'produce', garlic:'produce', potato:'produce', carrot:'produce', celery:'produce',
  tomato:'produce', lettuce:'produce', spinach:'produce', pepper:'produce', lemon:'produce',
  lime:'produce', apple:'produce', banana:'produce', avocado:'produce', mushroom:'produce',
  broccoli:'produce', cucumber:'produce', ginger:'produce', cilantro:'produce', parsley:'produce',
  chicken:'meat & seafood', beef:'meat & seafood', pork:'meat & seafood', bacon:'meat & seafood',
  sausage:'meat & seafood', salmon:'meat & seafood', shrimp:'meat & seafood', turkey:'meat & seafood',
  tuna:'meat & seafood',
  egg:'dairy & eggs', milk:'dairy & eggs', butter:'dairy & eggs', cheese:'dairy & eggs',
  yogurt:'dairy & eggs', cream:'dairy & eggs', parmesan:'dairy & eggs',
  bread:'bakery', tortilla:'bakery', bagel:'bakery', bun:'bakery',
  flour:'pantry', sugar:'pantry', rice:'pantry', pasta:'pantry', oil:'pantry', vinegar:'pantry',
  bean:'pantry', oat:'pantry', honey:'pantry', broth:'pantry', stock:'pantry',
  'soy sauce':'pantry', peanut:'pantry',
  salt:'spices', cumin:'spices', paprika:'spices', cinnamon:'spices', oregano:'spices',
  basil:'spices', thyme:'spices', chili:'spices',
  coffee:'beverages', tea:'beverages', juice:'beverages',
};

function guessCategory(name) {
  const key = normalizeName(name);
  if (!key) return 'other';
  if (KEYWORDS[key]) return KEYWORDS[key];
  for (const t of key.split(' ')) if (KEYWORDS[t]) return KEYWORDS[t];
  return 'other';
}

/* ---- ingredient line parser ----------------------------------------- */
const VULGAR = { '½':0.5,'⅓':1/3,'⅔':2/3,'¼':0.25,'¾':0.75,'⅕':0.2,'⅖':0.4,'⅗':0.6,'⅘':0.8,'⅙':1/6,'⅚':5/6,'⅛':0.125,'⅜':0.375,'⅝':0.625,'⅞':0.875 };

function parseIngredient(line) {
  const raw = String(line).trim();
  let s = raw;

  const optional = /^optional\b[:,]?\s*/i.test(s) || /\(optional\)/i.test(s);
  s = s.replace(/^optional\b[:,]?\s*/i, '').replace(/\(optional\)/ig, ' ');

  // Expand unicode fractions to " a/b" so the numeric matcher sees them.
  s = s.replace(/[½⅓⅔¼¾⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞]/g, (m) => ' ' + VULGAR[m] + ' ').replace(/\s+/g, ' ').trim();

  let quantity = null;
  // "1 1/2" | "1/2" | "2.5" | "2" — optionally a range, of which we take the low end.
  const qtyRe = /^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)\s*(?:(?:-|–|—|to)\s*(?:\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+))?/;
  const qm = s.match(qtyRe);
  if (qm) {
    quantity = parseNumeric(qm[1]);
    s = s.slice(qm[0].length).trim();
  }

  let unit = null;
  const um = s.match(/^([a-zA-Z.]+(?:\s+oz)?)\b\.?\s*/);
  if (um) {
    const maybe = parseUnit(um[1]);
    if (maybe) { unit = maybe; s = s.slice(um[0].length).trim(); }
  }
  s = s.replace(/^of\s+/i, '').trim();

  if (quantity !== null && !unit) unit = 'count';

  const { name, prep } = splitPrep(s.replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim());

  return {
    raw,
    name: name || raw,
    nameKey: normalizeName(name || raw),
    quantity,
    unit,
    prep,
    optional,
  };
}

function parseNumeric(text) {
  const t = text.trim();
  const mixed = t.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if (mixed) return Number(mixed[1]) + Number(mixed[2]) / Number(mixed[3]);
  const frac = t.match(/^(\d+)\/(\d+)$/);
  if (frac) return Number(frac[1]) / Number(frac[2]);
  return Number(t);
}

/* Detects a timed action in a step, e.g. "bake for 20-25 minutes".
   Uses the LOWER bound of a range — you want to check early, not find out late. */
function detectTimer(text) {
  const m = String(text).match(/(\d+)(?:\s*(?:-|–|to)\s*\d+)?\s*(second|sec|minute|min|hour|hr)s?\b/i);
  if (!m) return null;
  const n = Number(m[1]);
  const unit = m[2].toLowerCase();
  if (unit.startsWith('sec')) return n;
  if (unit.startsWith('min')) return n * 60;
  return n * 3600;
}

/* ---- recipe import --------------------------------------------------
   Pasted input, not a fetched URL. A published artifact cannot make network
   requests to any external host, and a browser's CORS rules would block most
   recipe sites even self-hosted. So: paste the page's text, or its source.
   If the source comes along we read schema.org/Recipe JSON-LD, which is what
   almost every major recipe site publishes. Otherwise we parse the text. */

function extractJsonLdBlocks(text) {
  const blocks = [];
  const re = /<script[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi;
  let m;
  while ((m = re.exec(text))) {
    try { blocks.push(JSON.parse(m[1].trim())); } catch { /* skip malformed */ }
  }
  // Also accept JSON-LD pasted on its own, with no surrounding HTML.
  if (!blocks.length) {
    const t = text.trim();
    if (t.startsWith('{') || t.startsWith('[')) {
      try { blocks.push(JSON.parse(t)); } catch { /* not JSON */ }
    }
  }
  return blocks;
}

function findRecipeNode(node, depth = 0) {
  if (!node || depth > 6) return null;
  if (Array.isArray(node)) {
    for (const n of node) { const hit = findRecipeNode(n, depth + 1); if (hit) return hit; }
    return null;
  }
  if (typeof node !== 'object') return null;

  const type = node['@type'];
  const types = Array.isArray(type) ? type : [type];
  if (types.includes('Recipe')) return node;

  for (const key of ['@graph', 'mainEntity', 'itemListElement']) {
    if (node[key]) { const hit = findRecipeNode(node[key], depth + 1); if (hit) return hit; }
  }
  return null;
}

function stripTags(s) {
  return String(s == null ? '' : s)
    .replace(/<[^>]+>/g, ' ')
    .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'")
    .replace(/\s+/g, ' ')
    .trim();
}

/* recipeInstructions is the messiest field in the wild: a plain string, an
   array of strings, HowToStep objects, or HowToSections that nest steps. */
function flattenInstructions(instr, out = []) {
  if (!instr) return out;
  if (typeof instr === 'string') {
    stripTags(instr).split(/\n+|(?<=\.)\s{2,}/).map((s) => s.trim()).filter(Boolean).forEach((s) => out.push(s));
    return out;
  }
  if (Array.isArray(instr)) { instr.forEach((i) => flattenInstructions(i, out)); return out; }
  if (typeof instr === 'object') {
    if (instr.itemListElement) return flattenInstructions(instr.itemListElement, out);
    const t = stripTags(instr.text || instr.name);
    if (t) out.push(t);
  }
  return out;
}

/* recipeYield is notoriously inconsistent: "8 servings", "4-6", "1 loaf",
   "1 9-inch pie". Take an integer only when it is unambiguously a count;
   otherwise keep the raw string as a hint and leave servings blank. */
function parseYield(y) {
  if (y == null) return { servings: null, yieldText: null };
  const raw = Array.isArray(y) ? String(y[0]) : String(y);
  const text = stripTags(raw);
  if (!text) return { servings: null, yieldText: null };

  if (/^\d+$/.test(text)) return { servings: Number(text), yieldText: text };
  const serving = text.match(/(\d+)(?:\s*(?:-|–|to)\s*\d+)?\s*(?:serving|portion|people|serves)/i);
  if (serving) return { servings: Number(serving[1]), yieldText: text };
  const leadServes = text.match(/^serves\s+(\d+)/i);
  if (leadServes) return { servings: Number(leadServes[1]), yieldText: text };
  const range = text.match(/^(\d+)\s*(?:-|–|to)\s*\d+$/);
  if (range) return { servings: Number(range[1]), yieldText: text };

  return { servings: null, yieldText: text };
}

function recipeFromJsonLd(node) {
  const title = stripTags(node.name) || 'Untitled recipe';
  const ingredients = (node.recipeIngredient || node.ingredients || [])
    .map((s) => stripTags(s)).filter(Boolean);
  const steps = flattenInstructions(node.recipeInstructions).filter((s) => s.length > 1);
  const { servings, yieldText } = parseYield(node.recipeYield);
  return { title, servings, yieldText, ingredients, steps, via: 'structured data' };
}

const ING_HEADING = /^(ingredients?|whatyou(?:'|’)?llneed|youwillneed)\s*:?\s*$/i;
const STEP_HEADING = /^(instructions?|directions?|method|steps?|preparation|howtomakeit|recipe|tomake)\s*:?\s*$/i;

/* PDFs and design tools letter-space their headings — "I N G R E D I E N T S"
   arrives with a space between every character. Collapsing all whitespace
   before testing catches both that and the ordinary spelling. */
const isIngHeading = (line) => ING_HEADING.test(line.replace(/\s+/g, ''));
const isStepHeading = (line) => STEP_HEADING.test(line.replace(/\s+/g, ''));

/**
 * Splits a paste containing several recipes.
 *
 * Prefers an explicit "---" separator. Failing that, a second ingredients
 * heading means a second recipe started, and the line before it is its title.
 */
function splitRecipeBlocks(text) {
  const explicit = text.split(/^\s*-{3,}\s*$/m).map((s) => s.trim()).filter(Boolean);
  if (explicit.length > 1) return explicit;

  const lines = text.split('\n');
  const headings = [];
  lines.forEach((l, i) => { if (isIngHeading(l.trim())) headings.push(i); });
  if (headings.length < 2) return [text];

  // Walk back over blank lines to find where each recipe's title begins.
  const starts = headings.map((i) => {
    let j = i - 1;
    while (j > 0 && !lines[j].trim()) j--;
    while (j > 0 && lines[j - 1].trim() && !isStepHeading(lines[j - 1].trim())) j--;
    return Math.max(0, j);
  });
  starts[0] = 0;

  const blocks = [];
  for (let b = 0; b < starts.length; b++) {
    blocks.push(lines.slice(starts[b], starts[b + 1] ?? lines.length).join('\n'));
  }
  return blocks.filter((s) => s.trim());
}

/** Repairs words broken across lines by PDF extraction: "Ser ve" -> "Serve". */
function healBrokenWords(text) {
  return text
    // A line ending mid-word, continued on the next line.
    .replace(/([a-z]{2,})\s*\n\s*([a-z]{1,3})\b/g, (m, a, b) => `${a}${b}`)
    .replace(/\bser\s+ve\b/gi, (m) => (m[0] === 'S' ? 'Serve' : 'serve'))
    .replace(/\binst\s*ruc\s*tions\b/gi, 'instructions')
    .replace(/\bB\s+ring\b/g, 'Bring')
    .replace(/\bsp\s*rinkle\b/gi, 'sprinkle')
    .replace(/\bp\s+reheat\b/gi, 'preheat')
    .replace(/\bchop\s+up\b/gi, 'chop')
    .replace(/\s+,/g, ',')
    .replace(/[ \t]{2,}/g, ' ');
}

/* Fallback for pasted visible text. Uses section headings when the page has
   them, and falls back to shape: lines that open with a quantity read as
   ingredients, longer sentences read as steps. */
function parseRecipeText(rawText) {
  const text = healBrokenWords(rawText);
  const lines = text.split('\n').map((l) => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  if (!lines.length) return null;

  const titleParts = [];
  const ingredients = [];
  const steps = [];
  let mode = 'head';
  let yieldText = null;
  let servings = null;
  let sawIngHeading = false;

  /* A wrapped ingredient continues the line above it. The tell is a long
     previous line followed by a short one that starts lowercase and carries
     no quantity of its own — "1 pound of boneless chicken" / "thighs, skin
     on". Deliberately conservative: a genuine unquantified ingredient like
     "Parmesan cheese" is capitalised, and short lists never trigger it. */
  const isWrappedContinuation = (line, previous) =>
    !!previous &&
    previous.length >= 22 &&
    !/[.;:!?]$/.test(previous) &&
    /^[a-z(]/.test(line) &&
    !/^[\d½⅓⅔¼¾⅛]/.test(line) &&
    line.length <= 40;

  for (const line of lines) {
    if (isIngHeading(line))  { mode = 'ing'; sawIngHeading = true; continue; }
    if (isStepHeading(line)) { mode = 'step'; continue; }

    const y = line.match(/^(?:yield|servings?|serves|makes)\s*:?\s*(.+)$/i);
    if (y) { const p = parseYield(y[1]); servings = p.servings; yieldText = p.yieldText; continue; }

    if (mode === 'head') {
      // Titles wrap too — collect the lines before the ingredients heading.
      if (titleParts.join(' ').length < 70) titleParts.push(line.replace(/^#+\s*/, ''));
      continue;
    }

    if (mode === 'ing') {
      const clean = line.replace(/^[-•*·▢]\s*/, '');

      // Some recipes list everything on one comma-separated line. Three or
      // more commas in a long line means a list, not one ingredient with a
      // prep note ("1 lb chicken thighs, skin on" stays whole).
      if ((clean.match(/,/g) || []).length >= 3 && clean.length > 60) {
        clean.split(',').map((s) => s.trim()).filter(Boolean).forEach((part) => ingredients.push(part));
        continue;
      }

      const previous = ingredients[ingredients.length - 1];
      if (isWrappedContinuation(clean, previous)) ingredients[ingredients.length - 1] = `${previous} ${clean}`;
      else ingredients.push(clean);
      continue;
    }

    if (mode === 'step') {
      const clean = line.replace(/^\d+[.)]\s*/, '');
      const previous = steps[steps.length - 1];
      // Steps wrap constantly; a line not starting a new number continues one.
      if (previous && !/^\d+[.)]/.test(line) && /^[a-z(&,]/.test(clean)) {
        steps[steps.length - 1] = `${previous} ${clean}`;
      } else {
        steps.push(clean);
      }
      continue;
    }
  }

  // Only trust a multi-line title when a real heading told us where it ended;
  // otherwise the "title" is just the first line of unstructured text.
  const title = (sawIngHeading ? titleParts.join(' ') : titleParts[0] || '').trim();

  // No headings at all: separate by shape.
  if (!ingredients.length && !steps.length) {
    for (const line of lines.slice(title ? 1 : 0)) {
      const looksLikeIngredient = /^[-•*·▢]?\s*(\d|½|⅓|⅔|¼|¾|⅛)/.test(line) && line.length < 90;
      if (looksLikeIngredient) ingredients.push(line.replace(/^[-•*·▢]\s*/, ''));
      else if (line.length > 25) steps.push(line.replace(/^\d+[.)]\s*/, ''));
    }
  }

  if (!title) title = 'Pasted recipe';
  return { title, servings, yieldText, ingredients, steps, via: 'pasted text' };
}

/** Tries structured data first, then plain text. Returns null if nothing usable. */
function parsePastedRecipe(text) {
  for (const block of extractJsonLdBlocks(text)) {
    const node = findRecipeNode(block);
    if (node) {
      const parsed = recipeFromJsonLd(node);
      if (parsed.ingredients.length || parsed.steps.length) return parsed;
    }
  }
  const fromText = parseRecipeText(text);
  if (fromText && (fromText.ingredients.length || fromText.steps.length)) return fromText;
  return null;
}

/** One paste, any number of recipes. Always returns an array. */
function parsePastedRecipes(text) {
  return splitRecipeBlocks(text)
    .map(parsePastedRecipe)
    .filter(Boolean);
}

/* ---- receipt parsing -------------------------------------------------
   Input comes from iOS Scan Text (long-press a field -> Scan Text), which
   does the OCR on-device. This turns the resulting mess into candidates.
   Everything here is a guess, so the UI reviews before anything is saved. */

/* Lines that are never groceries. */
const RECEIPT_NOISE = new RegExp([
  'sub\\s?total', '\\btotal\\b', '\\btax\\b', 'change\\s+due', '\\bchange\\b', '\\bcash\\b',
  '\\bcredit\\b', '\\bdebit\\b', '\\bvisa\\b', 'master\\s?card', '\\bamex\\b', 'discover',
  'balance', 'tender', 'savings', 'you\\s+saved', 'discount', 'coupon', 'member',
  'thank\\s*you', 'receipt', 'cashier', 'register', '\\blane\\b', 'transaction',
  'auth', 'approved', 'ref\\s*#', 'items?\\s+sold', 'store\\s*#', 'survey',
  'customer', 'return\\s+policy', 'www\\.', 'http', '\\.com', 'terminal', 'account',
  'purchase', 'debit\\s+card', 'chip\\s+read', 'aid:', 'invoice', 'order\\s*#',
  'phone', '\\btel\\b', 'manager', 'open\\s+\\d', 'points', 'reward',
].join('|'), 'i');

/* Common US grocery-receipt shorthand. Values are what we expand to;
   an empty string drops the token (store-brand prefixes, mostly). */
const RECEIPT_ABBREV = {
  chkn: 'chicken', chk: 'chicken', brst: 'breast', bnls: 'boneless', sknls: 'skinless',
  grnd: 'ground', gr: 'ground', bf: 'beef', prk: 'pork', sausg: 'sausage', bacn: 'bacon',
  mlk: 'milk', chz: 'cheese', chse: 'cheese', yog: 'yogurt', ygrt: 'yogurt', btr: 'butter',
  crm: 'cream', egg: 'eggs', eg: 'eggs',
  bnna: 'banana', ban: 'banana', tom: 'tomato', tmto: 'tomato', ltce: 'lettuce',
  onn: 'onion', onio: 'onion', pot: 'potato', ptato: 'potato', crrt: 'carrot',
  brocc: 'broccoli', spnch: 'spinach', avoc: 'avocado', mush: 'mushroom',
  brd: 'bread', tort: 'tortilla', bgl: 'bagel',
  org: 'organic', orgnc: 'organic', whl: 'whole', wht: 'wheat',
  lg: 'large', sm: 'small', med: 'medium', pkg: '', pk: '', ct: '', bag: '', box: '',
  // store-brand prefixes carry no ingredient meaning
  gv: '', 'grt': '', val: '', kro: '', sig: '', mkt: '', sb: '', hmn: '',
};

function expandReceiptWords(name) {
  return name
    .split(/\s+/)
    .map((w) => {
      const key = w.toLowerCase().replace(/[^a-z]/g, '');
      if (key in RECEIPT_ABBREV) return RECEIPT_ABBREV[key];
      return w;
    })
    .filter(Boolean)
    .join(' ')
    .trim();
}

/**
 * Parses one receipt line into a candidate pantry item, or null if the line
 * looks like anything other than a purchased good.
 */
function parseReceiptLine(rawLine, requirePrice = true) {
  const raw = rawLine.trim();
  if (!raw || raw.length < 3) return null;
  if (RECEIPT_NOISE.test(raw)) return null;

  let s = raw;
  let quantity = null;
  let unit = null;
  let price = null;
  let sawPrice = false;

  // Trailing price, optionally followed by a tax flag letter.
  const priceMatch = s.match(/\$?(\d{1,4}\.\d{2})\s*[A-Z]{0,2}\s*$/);
  if (priceMatch) {
    price = Number(priceMatch[1]);
    sawPrice = true;
    s = s.slice(0, priceMatch.index).trim();
  }

  // On a real receipt every purchased item carries a price, so a line without
  // one is a store header, an address, or OCR noise. But that rule is only
  // safe when the text actually looks like a receipt — see parseReceipt().
  if (requirePrice && !sawPrice) return null;

  // "1.87 lb @ 4.99/lb" — weight priced by the pound.
  const weighed = s.match(/(\d+\.?\d*)\s*(lb|lbs|kg|oz|g)\b\s*@\s*\$?\d+\.?\d*/i);
  if (weighed) {
    quantity = Number(weighed[1]);
    unit = parseUnit(weighed[2]) || 'count';
    s = s.slice(0, weighed.index).trim();
  } else {
    // "2 @ 0.59" — a count at a unit price.
    const counted = s.match(/(\d+)\s*@\s*\$?\d+\.?\d*/);
    if (counted) {
      quantity = Number(counted[1]);
      unit = 'count';
      s = s.slice(0, counted.index).trim();
    }
  }

  // Strip SKU / UPC runs and leftover standalone prices.
  s = s.replace(/\b\d{5,}\b/g, ' ')
       .replace(/\$?\d+\.\d{2}\b/g, ' ')
       .replace(/\s*@\s*/g, ' ')
       .replace(/[*#]+/g, ' ')
       .replace(/\s{2,}/g, ' ')
       .trim();

  // A leading count: "2 AVOCADO".
  if (quantity === null) {
    const lead = s.match(/^(\d{1,2})\s+(?=[A-Za-z])/);
    if (lead) { quantity = Number(lead[1]); unit = 'count'; s = s.slice(lead[0].length).trim(); }
  }

  // A size in the name: "MILK 1 GAL", "YOGURT 32 OZ".
  const sized = s.match(/\b(\d+\.?\d*)\s*(gal|gallon|qt|quart|pt|pint|floz|fl\s?oz|oz|lb|lbs|kg|g|ml|l|ct|count)\b/i);
  if (sized && quantity === null) {
    const u = parseUnit(sized[2].replace(/\s+/g, ' '));
    if (u) { quantity = Number(sized[1]); unit = u; }
  }
  s = s.replace(/\b\d+\.?\d*\s*(gal|gallon|qt|quart|pt|pint|floz|fl\s?oz|oz|lb|lbs|kg|g|ml|l|ct|count)\b/ig, ' ')
       .replace(/\s{2,}/g, ' ').trim();

  const name = expandReceiptWords(s).replace(/\s{2,}/g, ' ').trim();

  // Reject leftovers that are not plausibly a food name.
  if (!name || name.length < 2) return null;
  if (!/[a-z]{2}/i.test(name)) return null;
  if (/^\d+$/.test(name)) return null;

  const nameKey = normalizeName(name);
  if (!nameKey) return null;

  return {
    raw,
    name: name.toLowerCase().replace(/\b[a-z]/g, (c) => c.toUpperCase()),
    nameKey,
    quantity: quantity == null ? 1 : quantity,
    unit: unit || 'count',
    price,
    category: guessCategory(name),
  };
}

/**
 * Two passes, because the box takes two very different kinds of text.
 *
 * A scanned receipt has prices, and requiring one is what keeps store headers
 * and card lines out. A hand-typed or partially-scanned list has none, and
 * that same rule would reject every line — so when nothing at all carries a
 * price, treat the text as a plain list of items instead of refusing it.
 */
function parseReceipt(text) {
  const lines = String(text).split('\n');

  const priced = lines.map((l) => parseReceiptLine(l, true)).filter(Boolean);
  if (priced.length) return priced;

  return lines.map((l) => parseReceiptLine(l, false)).filter(Boolean);
}

/* ---- equipment and time ----------------------------------------------
   Both are read from the steps rather than stored, so they work on recipes
   saved before this existed and on anything pasted in later. */
const EQUIPMENT = [
  { key: 'air fryer',   label: 'Air fryer',   re: /\bair\s?-?\s?fry(er|ing)?\b/i },
  { key: 'oven',        label: 'Oven',        re: /\b(oven|bake[sd]?|baking|roast(ed|ing)?|broil)\b/i },
  { key: 'slow cooker', label: 'Slow cooker', re: /\b(slow\s?cooker|crock\s?pot)\b/i },
  { key: 'grill',       label: 'Grill',       re: /\bgrill(ed|ing)?\b/i },
  { key: 'microwave',   label: 'Microwave',   re: /\bmicrowave\b/i },
  { key: 'blender',     label: 'Blender',     re: /\b(blend(er|ed)?|food processor|purée|puree)\b/i },
  { key: 'stovetop',    label: 'Stovetop',    re: /\b(pan|skillet|pot|saucepan|wok|griddle|simmer|saut|boil|sear|fry|fried|frying|stove|burner)\b/i },
];

/** Detected appliances, or ['no cook'] when the steps involve no heat. */
function recipeEquipment(recipe) {
  const all = recipe.steps.map((s) => s.text).join(' ');
  // Remove air-fryer mentions before testing stovetop, or "air fry" would
  // also register as frying in a pan.
  const withoutAirFryer = all.replace(/\bair\s?-?\s?fry(er|ing)?\b/gi, ' ');

  const found = [];
  for (const e of EQUIPMENT) {
    const haystack = e.key === 'stovetop' ? withoutAirFryer : all;
    if (e.re.test(haystack)) found.push(e.key);
  }
  return found.length ? found : ['no cook'];
}

/** Every duration mentioned in a piece of text, in seconds. */
function sumDurations(text) {
  let total = 0;
  // "3 more minutes" and "5 additional minutes" are ordinary phrasings, so a
  // couple of filler words are allowed between the number and its unit.
  const re = /(\d+)(?:\s*(?:-|–|to)\s*(\d+))?\s*(?:more\s+|additional\s+|extra\s+|further\s+)?(second|sec|minute|min|hour|hr)s?\b/gi;
  let m;
  while ((m = re.exec(text))) {
    const n = Number(m[1]);
    const unit = m[3].toLowerCase();
    total += unit.startsWith('sec') ? n : unit.startsWith('min') ? n * 60 : n * 3600;
  }
  return total;
}

/** Rough total time in minutes, or null when the recipe never says. */
function recipeMinutes(recipe) {
  const seconds = recipe.steps.reduce((sum, s) => sum + sumDurations(s.text), 0);
  return seconds ? Math.max(1, Math.round(seconds / 60)) : null;
}

function formatMinutes(mins) {
  if (mins == null) return '';
  if (mins < 60) return `${mins} min`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m ? `${h} hr ${m} min` : `${h} hr`;
}

/* ---- availability --------------------------------------------------- */
/* Five states, per spec §6. Tuned conservative: a false "you have it"
   ruins a recipe mid-cook, a false "you're missing it" costs a duplicate. */
function findPantryMatch(nameKey, pantry, aliases) {
  const key = aliases[nameKey] || nameKey;
  let hit = pantry.find((p) => p.nameKey === key);
  if (hit) return hit;
  // Token-overlap: "chicken breast" finds "boneless chicken breasts".
  const tokens = key.split(' ').filter(Boolean);
  hit = pantry.find((p) => {
    const pt = p.nameKey.split(' ').filter(Boolean);
    return tokens.every((t) => pt.includes(t)) || pt.every((t) => tokens.includes(t));
  });
  return hit || null;
}

const lookupBy = (table, nameKey) => table[nameKey] ?? table[nameKey.split(' ').pop()];

/**
 * Converts an amount between any two units, using per-ingredient knowledge
 * when the units belong to different dimensions. Returns null when the
 * conversion is genuinely unknowable — never a guess.
 */
function convertAmount(qty, from, to, nameKey) {
  const direct = convert(qty, from, to);
  if (direct !== null) return direct;

  const fromDim = dimensionOf(from);
  const toDim = dimensionOf(to);

  const density = lookupBy(DENSITY, nameKey); // grams per millilitre
  if (density) {
    if (fromDim === 'volume' && toDim === 'mass') return (toCanonical(qty, from) * density) / UNITS[to].k;
    if (fromDim === 'mass' && toDim === 'volume') return (toCanonical(qty, from) / density) / UNITS[to].k;
  }

  const piece = lookupBy(PIECE_WEIGHT, nameKey); // grams per item
  if (piece) {
    if (fromDim === 'count' && toDim === 'mass')   return (qty * piece) / UNITS[to].k;
    if (fromDim === 'mass'  && toDim === 'count')  return toCanonical(qty, from) / piece;
    if (fromDim === 'count' && toDim === 'volume' && density) return ((qty * piece) / density) / UNITS[to].k;
    if (fromDim === 'volume' && toDim === 'count' && density) return (toCanonical(qty, from) * density) / piece;
  }

  return null;
}

function compareQuantity(need, needUnit, have, haveUnit, nameKey) {
  if (!needUnit || !haveUnit) return { comparable: false };
  const haveInNeedUnit = convertAmount(have, haveUnit, needUnit, nameKey);
  if (haveInNeedUnit === null) return { comparable: false };
  return {
    comparable: true,
    have: haveInNeedUnit,
    need,
    converted: dimensionOf(haveUnit) !== dimensionOf(needUnit),
  };
}

/* ---- week plan -------------------------------------------------------
   Totals every planned recipe's ingredients before checking the pantry.
   Checking recipes one at a time is misleading: with six eggs, two recipes
   needing six each both report "have", and you are three short of the
   second one before you start. */
function planTotals(plan, recipes, aliases) {
  const totals = new Map();

  for (const entry of plan) {
    const recipe = recipes.find((r) => r.id === entry.recipeId);
    if (!recipe) continue;
    const batches = Math.max(1, entry.batches || 1);

    for (const ing of scaledIngredients(recipe, batches)) {
      if (!ing.nameKey) continue;
      const key = aliases[ing.nameKey] || ing.nameKey;
      const existing = totals.get(key);

      if (!existing) {
        totals.set(key, {
          key,
          name: ing.name,
          unit: ing.unit || 'count',
          needed: ing.quantity == null ? 0 : ing.quantity,
          unknown: ing.quantity == null,
          usedBy: [recipe.title],
        });
        continue;
      }

      if (!existing.usedBy.includes(recipe.title)) existing.usedBy.push(recipe.title);

      if (ing.quantity == null || !ing.unit) { existing.unknown = true; continue; }
      const converted = convertAmount(ing.quantity, ing.unit, existing.unit, key);
      if (converted === null) existing.unknown = true;
      else existing.needed += converted;
    }
  }

  return [...totals.values()].map((t) => {
    const match = findPantryMatch(t.key, state.pantry, aliases);
    const have = match && match.quantity > 0
      ? convertAmount(match.quantity, match.unit, t.unit, t.key)
      : 0;

    if (t.unknown) return { ...t, state: 'unverified', have, shortfall: null, match };
    if (have === null) return { ...t, state: 'unverified', have: null, shortfall: null, match };
    if (have >= t.needed - 1e-9) return { ...t, state: 'have', have, shortfall: 0, match };

    return {
      ...t,
      state: have > 0 ? 'short' : 'missing',
      have,
      shortfall: Math.round((t.needed - have) * 100) / 100,
      match,
    };
  }).sort((a, b) => a.name.localeCompare(b.name));
}

/* ---- "I made this" ---------------------------------------------------
   The inverse of the availability check: work out what cooking this recipe
   should take out of the pantry. Returns a plan rather than mutating, so the
   UI can show it and let the cook uncheck anything they didn't actually use. */
function deductionPlan(recipe, pantry, aliases) {
  return scaledIngredients(recipe).map((ing) => {
    const match = findPantryMatch(ing.nameKey, pantry, aliases);

    if (!match) return { ing, match: null, status: 'unmatched', amount: null };
    // An entry sitting at zero is not stock. Offering to take three eggs from
    // a count of zero is nonsense, and it silently under-reports what you
    // actually need to buy.
    if (match.quantity <= 0) return { ing, match, status: 'none-left', amount: null };
    if (ing.quantity == null || !ing.unit) {
      return { ing, match, status: 'unknown-amount', amount: null };
    }

    const amount = convertAmount(ing.quantity, ing.unit, match.unit, ing.nameKey);
    if (amount === null) return { ing, match, status: 'unconvertible', amount: null };

    const rounded = Math.round(amount * 100) / 100;
    return {
      ing,
      match,
      status: rounded > match.quantity ? 'more-than-you-have' : 'ok',
      amount: rounded,
      converted: dimensionOf(ing.unit) !== dimensionOf(match.unit),
    };
  });
}

function availabilityFor(ing, pantry, aliases) {
  const match = findPantryMatch(ing.nameKey, pantry, aliases);
  if (!match) return { state: 'unmatched', match: null };
  if (match.quantity <= 0) return { state: 'missing', match };
  if (ing.quantity == null) return { state: 'have', match, note: 'no amount specified' };

  const cmp = compareQuantity(ing.quantity, ing.unit, match.quantity, match.unit, ing.nameKey);
  if (!cmp.comparable) return { state: 'unverified', match };
  if (cmp.have >= cmp.need - 1e-9) return { state: 'have', match, converted: cmp.converted };

  return {
    state: 'short',
    match,
    converted: cmp.converted,
    shortfall: Math.max(0, cmp.need - cmp.have),
    haveInNeedUnit: cmp.have,
  };
}

/* ══════════════════════════════════════════════════════════════════════
   STORE — localStorage persistence
   ══════════════════════════════════════════════════════════════════════ */
const STORAGE_KEY = 'mise.v1';

const DEFAULT_SETTINGS = { removeAtZero: false };

const blank = () => ({
  pantry: [], list: [], recipes: [], aliases: {}, history: [], plan: [],
  settings: { ...DEFAULT_SETTINGS },
});

/**
 * Writes a probe and reads it back, because "localStorage exists" is not the
 * same as "localStorage persists". A sandboxed iframe can hand back a working
 * object bound to an opaque origin that is thrown away on reload — which
 * looks fine while the app is open and loses everything when it reopens.
 * Returns 'ok' | 'unreliable' | 'blocked'.
 */
function probeStorage() {
  try {
    const probe = '__mise_probe__';
    localStorage.setItem(probe, 'x');
    const readBack = localStorage.getItem(probe);
    localStorage.removeItem(probe);
    if (readBack !== 'x') return 'unreliable';
    return 'ok';
  } catch {
    return 'blocked';
  }
}

const STORAGE_STATE = probeStorage();

let state = load();

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return blank();
    const parsed = JSON.parse(raw);
    const merged = Object.assign(blank(), parsed);
    // Settings gain keys over time; fill in any the saved copy predates.
    merged.settings = Object.assign({ ...DEFAULT_SETTINGS }, parsed.settings || {});
    return merged;
  } catch (err) {
    console.warn('[mise] could not read saved data, starting empty', err);
    return blank();
  }
}

let lastSaveOk = STORAGE_STATE === 'ok';

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    lastSaveOk = STORAGE_STATE === 'ok';
  } catch {
    lastSaveOk = false;
  }
  updateStorageAlarm();
}

/* Never lose data quietly. If this browser will not keep the data, say so
   at the top of the screen every time, and put a backup one tap away. */
function updateStorageAlarm() {
  const el = document.getElementById('storageAlarm');
  if (!el) return;

  const broken = STORAGE_STATE !== 'ok' || !lastSaveOk;
  el.hidden = !broken;
  if (!broken) return;

  const title = document.getElementById('alarmTitle');
  const body = document.getElementById('alarmBody');

  if (STORAGE_STATE === 'blocked') {
    title.textContent = 'This browser is blocking storage';
    body.textContent = 'Everything you enter will be gone when you close Mise. Save a backup before you leave, or open Mise from a normal browser tab instead of a private one.';
  } else if (STORAGE_STATE === 'unreliable') {
    title.textContent = 'Your data will not survive closing this';
    body.textContent = 'Storage here is temporary, so Mise starts empty each time. Keep a backup, or ask for a hosted copy where saving works properly.';
  } else {
    title.textContent = 'The last save failed';
    body.textContent = 'Storage may be full. Save a backup now so you do not lose what you have entered.';
  }
}

/* Ask the browser to treat this data as durable rather than evictable.
   Safari clears ordinary site storage after about a week of not visiting;
   an installed home-screen app is normally granted persistence. */
async function requestDurableStorage() {
  try {
    if (navigator.storage && navigator.storage.persist) {
      const already = await navigator.storage.persisted();
      if (!already) await navigator.storage.persist();
    }
  } catch { /* not supported — the backup file is the real safety net */ }
}

/* ---- backup & restore ------------------------------------------------ */
function backupPayload() {
  return JSON.stringify({ app: 'mise', version: 1, exportedAt: new Date().toISOString(), data: state }, null, 2);
}

function backupFilename() {
  return `mise-backup-${new Date().toISOString().slice(0, 10)}.json`;
}

function applyBackup(text) {
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch {
    return { ok: false, error: "That doesn't look like a Mise backup — it isn't valid JSON." };
  }
  const data = parsed && parsed.data ? parsed.data : parsed;
  if (!data || typeof data !== 'object' || !Array.isArray(data.pantry)) {
    return { ok: false, error: "That JSON isn't a Mise backup — no pantry list inside." };
  }
  state = Object.assign(blank(), {
    pantry: data.pantry || [],
    list: data.list || [],
    recipes: data.recipes || [],
    aliases: data.aliases || {},
    history: data.history || [],
    plan: data.plan || [],
    settings: Object.assign({ ...DEFAULT_SETTINGS }, data.settings || {}),
  });
  save();
  return {
    ok: true,
    counts: { pantry: state.pantry.length, list: state.list.length, recipes: state.recipes.length },
  };
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/**
 * Records that something was actually bought, so it can be re-added later.
 * Called from the two places a purchase really happens: checking an item off
 * the shopping list, and importing a receipt.
 */
function recordPurchase({ name, nameKey, quantity, unit, category }) {
  if (!nameKey) return;
  const existing = state.history.find((h) => h.nameKey === nameKey);
  if (existing) {
    existing.count++;
    existing.lastBought = Date.now();
    existing.name = name || existing.name;
    if (quantity != null) existing.quantity = quantity;
    if (unit) existing.unit = unit;
    if (category) existing.category = category;
  } else {
    state.history.push({
      nameKey,
      name: name || nameKey,
      quantity: quantity ?? null,
      unit: unit || 'count',
      category: category || guessCategory(name || nameKey),
      count: 1,
      lastBought: Date.now(),
    });
  }
}

/** What you bought last time under this name, or null. */
function recallPurchase(name) {
  const key = normalizeName(name || '');
  if (!key) return null;
  return state.history.find((h) => h.nameKey === key) || null;
}

/**
 * Wires "remember what I bought last time" onto an add form.
 *
 * Typing a name you've bought before fills in the amount, unit and category
 * from that purchase — eggs come back as 12 without you saying so. It stops
 * the moment you touch any of those fields yourself, so it suggests rather
 * than fights you.
 */
function attachRecall({ nameInput, qtyInput, unitGroup, catGroup, hintEl }) {
  let auto = true;

  const stopAuto = () => {
    auto = false;
    if (hintEl) hintEl.textContent = '';
  };
  if (qtyInput) qtyInput.addEventListener('input', stopAuto);
  [unitGroup, catGroup].filter(Boolean).forEach((id) => {
    document.querySelectorAll(`#${id} .chip`).forEach((c) => c.addEventListener('click', stopAuto));
  });

  const press = (groupId, value) => {
    if (!groupId || value == null) return;
    document.querySelectorAll(`#${groupId} .chip`).forEach((c) =>
      c.setAttribute('aria-pressed', String(c.dataset.value === value))
    );
  };

  nameInput.addEventListener('input', () => {
    if (!auto) return;
    const typed = nameInput.value.trim();
    const past = recallPurchase(typed);

    if (past) {
      if (qtyInput && past.quantity != null) qtyInput.value = formatQuantity(past.quantity);
      press(unitGroup, past.unit);
      press(catGroup, past.category);
      if (hintEl) {
        const amount = past.quantity != null ? `${formatQuantity(past.quantity)} ${unitLabel(past.unit) || ''}`.trim() : past.unit;
        hintEl.textContent = `Last time you bought ${amount} — change it if this trip is different.`;
      }
      return;
    }

    // Nothing bought before under this name: fall back to guessing a category.
    press(catGroup, typed ? guessCategory(typed) : null);
    if (hintEl) hintEl.textContent = '';
  });
}

/** Most-bought first, then most-recent. Things already on the list are hidden. */
function buyAgainCandidates() {
  const onList = new Set(state.list.filter((i) => !i.checked).map((i) => i.nameKey));
  return state.history
    .filter((h) => !onList.has(h.nameKey))
    .sort((a, b) => (b.count - a.count) || (b.lastBought - a.lastBought));
}

const LOCATIONS = ['fridge', 'freezer', 'pantry', 'spices', 'other'];

/**
 * Drops emptied pantry entries when "remove at zero" is on. Returns the names
 * removed so the caller can offer to put them on the shopping list — running
 * out is exactly when you want that.
 *
 * Off by default: an entry at zero is still a useful record of something you
 * normally keep, and "buy it again" already remembers what you buy.
 */
function pruneZeroed() {
  if (!state.settings.removeAtZero) return [];
  const gone = state.pantry.filter((p) => p.quantity <= 0);
  if (!gone.length) return [];
  state.pantry = state.pantry.filter((p) => p.quantity > 0);
  return gone.map((p) => p.name);
}

/** Puts names on the shopping list, skipping anything already active there. */
function addNamesToList(names) {
  let added = 0;
  for (const name of names) {
    const nameKey = normalizeName(name);
    if (state.list.some((i) => !i.checked && i.nameKey === nameKey)) continue;
    state.list.push({
      id: uid(), name, nameKey, quantity: null, unit: 'count', note: null,
      category: guessCategory(name), checked: false, checkedAt: null,
      sourceRecipeId: null, addedAt: Date.now(),
    });
    added++;
  }
  return added;
}

function esc(s) {

}

const ICON = {

  plus:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5 5L20 6.5"/></svg>',

let toastTimer = null;
function toast(message, actionLabel, onAction) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(message)}</span>`;

    const b = document.createElement('button');
    b.textContent = actionLabel;
    b.onclick = () => { hideToast(); onAction && onAction(); };

  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actionLabel ? 6000 : 2600);
}

function unitLabel(u) { return u === 'count' ? '' : u; }

function qtyLabel(q, u) {
  if (q == null) return '';

}

/* Chips group: returns HTML; read the value with readChips(id). */
function chipsHTML(id, options, selected, allowNone) {
  const opts = options.map((o) =>
    `<button type="button" class="chip" data-chip="${id}" data-value="${esc(o)}" aria-pressed="${o === selected}">${esc(o)}</button>`
  ).join('');
  return `<div class="chips" id="${id}" data-allow-none="${!!allowNone}">${opts}</div>`;
}

function readChips(id) {
  const el = document.getElementById(id);
  if (!el) return null;
  const on = el.querySelector('[aria-pressed="true"]');
  return on ? on.dataset.value : null;
}

document.addEventListener('click', (e) => {
  const chip = e.target.closest('[data-chip]');
  if (!chip) return;
  const group = chip.parentElement;
  const wasOn = chip.getAttribute('aria-pressed') === 'true';
  group.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));
  if (!(wasOn && group.dataset.allowNone === 'true')) chip.setAttribute('aria-pressed', 'true');
});

let pantryGroupBy = 'location';

function renderPantry() {
  const view = $('#view-pantry');
  const items = [...state.pantry].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));

  let html = `
    <div class="toolbar">
      <div class="segment" role="group" aria-label="Group pantry by">
        <button type="button" data-group="location" aria-pressed="${pantryGroupBy === 'location'}">By location</button>
        <button type="button" data-group="category" aria-pressed="${pantryGroupBy === 'category'}">By category</button>
      </div>
      <button class="icon-btn icon-btn-quiet" id="scanReceipt" aria-label="Scan a receipt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2-1.4L14 21l-2-1.4L10 21l-2-1.4L6 21V3Z"/><path d="M9 8h6M9 12h6"/></svg>
      </button>
    </div>`;

  if (!items.length) {
    html += `<div class="empty">
      <h3>Nothing here yet</h3>
      <p>Add what you already have at home. This is what your recipes get checked against.</p>
    </div>`;
    view.innerHTML = html;
    bindPantry(view);
    return;
  }

  const groups = new Map();
  for (const it of items) {
    const key = (pantryGroupBy === 'location' ? it.location : it.category) || 'unsorted';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  }

  for (const [name, groupItems] of [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
    html += `<div class="section-head"><h2>${esc(name)}</h2><span class="section-count">${groupItems.length}</span></div><div class="rows">`;
    for (const it of groupItems) {
      html += `
        <div class="row" data-id="${it.id}">
          <button class="row-main" data-edit="${it.id}">
            <span class="row-name">${esc(it.name)}</span>
            ${it.category ? `<span class="row-sub">${esc(it.category)}</span>` : ''}
          </button>
          <div class="stepper">
            <button data-step="-1" data-id="${it.id}" aria-label="Decrease ${esc(it.name)}">${ICON.minus}</button>
            <span class="stepper-value">${formatQuantity(it.quantity)}${unitLabel(it.unit) ? ` <span class="stepper-unit">${esc(unitLabel(it.unit))}</span>` : ''}</span>
            <button data-step="1" data-id="${it.id}" aria-label="Increase ${esc(it.name)}">${ICON.plus}</button>
          </div>
        </div>`;
    }
    html += `</div>`;
  }

  view.innerHTML = html;
  bindPantry(view);
}

function bindPantry(view) {
  view.querySelectorAll('[data-group]').forEach((b) => {
    b.onclick = () => { pantryGroupBy = b.dataset.group; renderPantry(); };
  });
  view.querySelectorAll('[data-step]').forEach((b) => {
    b.onclick = () => adjustPantry(b.dataset.id, Number(b.dataset.step));
  });
  view.querySelectorAll('[data-edit]').forEach((b) => {
    b.onclick = () => editPantryItem(b.dataset.edit);
  });
  const scan = view.querySelector('#scanReceipt');
  if (scan) scan.onclick = importReceipt;
}

function adjustPantry(id, delta) {
  const it = state.pantry.find((p) => p.id === id);
  if (!it) return;
  it.quantity = Math.max(0, Math.round((it.quantity + delta) * 100) / 100);
  it.updatedAt = Date.now();

  const removed = pruneZeroed();
  save();
  render();

  if (removed.length) {
    toast(`${removed[0]} removed — you're out`, 'Add to list', () => {
      const n = addNamesToList(removed);
      save();
      render();
      toast(`${n} added to your list`);
    });
  }
}

function editPantryItem(id) {
  const existing = id ? state.pantry.find((p) => p.id === id) : null;
  const body = `
    <div class="field">
      <label for="pName">Name</label>
      <input class="input" id="pName" placeholder="e.g. chicken breast" autocapitalize="none" value="${esc(existing?.name || '')}">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="pQty">Quantity</label>
        <input class="input" id="pQty" inputmode="decimal" value="${existing ? formatQuantity(existing.quantity) : '1'}">
        <p class="hint" id="pRecall"></p>
      </div>
    </div>
    <div class="field">
      <label for="pUnit">Unit</label>
      ${chipsHTML('pUnit', ALL_UNITS, existing?.unit || 'count', false)}
    </div>
    <div class="field">
      <label for="pLoc">Location</label>
      ${chipsHTML('pLoc', LOCATIONS, existing?.location || null, true)}
    </div>
    <div class="field">
      <label for="pCat">Category</label>
      ${chipsHTML('pCat', ALL_CATEGORIES, existing?.category || null, true)}
      <p class="hint" id="pCatHint">${existing ? '' : 'Guessed from the name as you type. Tap to override.'}</p>
    </div>`;

  openSheet(existing ? 'Edit item' : 'Add to pantry', body, existing ? 'Save' : 'Add', () => {
    const name = $('#pName').value.trim();
    if (!name) { toast('Give the item a name.'); $('#pName').focus(); return; }
    const quantity = Number(String($('#pQty').value).replace(',', '.'));
    if (!Number.isFinite(quantity) || quantity < 0) { toast('Enter a quantity of zero or more.'); return; }

    const fields = {
      name,
      nameKey: normalizeName(name),
      quantity,
      unit: readChips('pUnit') || 'count',
      location: readChips('pLoc'),
      category: readChips('pCat'),
      updatedAt: Date.now(),
    };

    if (existing) Object.assign(existing, fields);
    else state.pantry.push(Object.assign({ id: uid(), createdAt: Date.now(), lowThreshold: null }, fields));

    save();
    closeSheet();
    render();
  }, existing ? `<button class="linkish" id="pDelete">Delete</button>` : '');

  if (!existing) {
    attachRecall({
      nameInput: $('#pName'),
      qtyInput: $('#pQty'),
      unitGroup: 'pUnit',
      catGroup: 'pCat',
      hintEl: $('#pRecall'),
    });
    document.querySelectorAll('#pCat .chip').forEach((c) => c.addEventListener('click', () => {
      const hint = $('#pCatHint');
      if (hint) hint.textContent = '';
    }));
  }

  const del = $('#pDelete');
  if (del) del.onclick = () => {
    const removed = existing;
    state.pantry = state.pantry.filter((p) => p.id !== removed.id);
    save();
    closeSheet();
    render();
    toast(`Removed ${removed.name}`, 'Undo', () => { state.pantry.push(removed); save(); render(); });
  };
}
