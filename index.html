/* Receipt OCR is always a bit wrong, so nothing is saved without review. */
function reviewReceipt(items) {
  const rows = items.map((it, i) => `
    <div class="row" style="align-items:stretch">
      <button class="check" data-rcheck="${i}" role="checkbox" aria-checked="true" aria-label="Include ${esc(it.name)}">
        <span class="check-box">${ICON.check}</span>
      </button>
      <div class="row-main" style="cursor:default;gap:6px;padding:10px 0">
        <input class="input" data-rname="${i}" value="${esc(it.name)}" style="min-height:38px;padding:6px 10px;font-size:15px">
        <div style="display:flex;gap:6px;align-items:center">
          <input class="input" data-rqty="${i}" value="${formatQuantity(it.quantity)}" inputmode="decimal" style="min-height:34px;padding:4px 8px;font-size:14px;width:66px">
          <span class="pill">${esc(it.unit)}</span>
          <span class="row-sub" style="flex:1;min-width:0">${esc(it.raw)}</span>
        </div>
      </div>
    </div>`).join('');

  const body = `
    <p class="hint" style="margin-top:0">${items.length} item${items.length === 1 ? '' : 's'} read. Receipt shorthand is often wrong — fix the names and amounts here, and uncheck anything that isn’t food.</p>
    <div class="rows" style="padding:0">${rows}</div>`;

  openSheet('Check the receipt', body, 'Add to pantry', () => {
    let added = 0, merged = 0;
    const undo = JSON.parse(JSON.stringify(state.pantry));

    items.forEach((it, i) => {
      const box = document.querySelector(`[data-rcheck="${i}"]`);
      if (!box || box.getAttribute('aria-checked') !== 'true') return;

      const name = document.querySelector(`[data-rname="${i}"]`).value.trim();
      if (!name) return;
      const qty = Number(String(document.querySelector(`[data-rqty="${i}"]`).value).replace(',', '.'));
      if (!Number.isFinite(qty) || qty <= 0) return;

      const nameKey = normalizeName(name);
      recordPurchase({ name, nameKey, quantity: qty, unit: it.unit, category: guessCategory(name) });
      const existing = state.pantry.find((p) => p.nameKey === nameKey && p.unit === it.unit);

      if (existing) {
        existing.quantity = Math.round((existing.quantity + qty) * 100) / 100;
        existing.updatedAt = Date.now();
        merged++;
      } else {
        state.pantry.push({
          id: uid(), name, nameKey, quantity: qty, unit: it.unit,
          category: guessCategory(name), location: null, lowThreshold: null,
          createdAt: Date.now(), updatedAt: Date.now(),
        });
        added++;
      }
    });

    save();
    closeSheet();
    render();

    if (!added && !merged) { toast('Nothing was checked.'); return; }
    const parts = [];
    if (added) parts.push(`${added} added`);
    if (merged) parts.push(`${merged} topped up`);
    toast(parts.join(', '), 'Undo', () => { state.pantry = undo; save(); render(); });
  });

  // Checkbox toggling inside the review list.
  document.querySelectorAll('[data-rcheck]').forEach((b) => {
    b.onclick = () => b.setAttribute('aria-checked', String(b.getAttribute('aria-checked') !== 'true'));
  });
}

/* ══════════════════════════════════════════════════════════════════════
   SHOPPING LIST
   ══════════════════════════════════════════════════════════════════════ */
const RECENT_WINDOW = 7 * 24 * 60 * 60 * 1000;
const PURGE_AFTER = 30 * 24 * 60 * 60 * 1000;

function purgeOldChecked() {
  const cutoff = Date.now() - PURGE_AFTER;
  const before = state.list.length;
  state.list = state.list.filter((i) => !i.checked || (i.checkedAt || 0) > cutoff);
  if (state.list.length !== before) save();
}

function renderList() {
  const view = $('#view-list');
  const active = state.list.filter((i) => !i.checked);
  const recent = state.list
    .filter((i) => i.checked && (i.checkedAt || 0) > Date.now() - RECENT_WINDOW)
    .sort((a, b) => (b.checkedAt || 0) - (a.checkedAt || 0));

  const canBuyAgain = buyAgainCandidates().length > 0;

  let html = canBuyAgain
    ? `<div class="toolbar"><button class="btn" id="buyAgain" style="flex:1">Buy it again</button></div>`
    : '';

  if (!active.length && !recent.length) {
    html += `<div class="empty">
      <h3>List is empty</h3>
      <p>Add what you need to buy, or open a recipe and send its missing ingredients here.</p>
    </div>`;
    view.innerHTML = html;
    const again0 = view.querySelector('#buyAgain');
    if (again0) again0.onclick = openBuyAgain;
    return;
  }

  if (active.length) {
    const groups = new Map();
    for (const it of active) {
      const key = it.category || 'other';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(it);
    }
    for (const [name, groupItems] of [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
      html += `<div class="section-head"><h2>${esc(name)}</h2><span class="section-count">${groupItems.length}</span></div><div class="rows">`;
      for (const it of groupItems) html += listRowHTML(it);
      html += `</div>`;
    }
  } else {
    html += `<div class="empty"><h3>All bought</h3><p>Nothing left on the active list.</p></div>`;
  }

  if (recent.length) {
    html += `<div class="section-head"><h2>Checked off recently</h2><span class="section-count">${recent.length}</span></div><div class="rows">`;
    for (const it of recent) html += listRowHTML(it);
    html += `</div>`;
  }

  view.innerHTML = html;

  view.querySelectorAll('[data-check]').forEach((b) => { b.onclick = () => toggleChecked(b.dataset.check); });
  view.querySelectorAll('[data-editlist]').forEach((b) => { b.onclick = () => editListItem(b.dataset.editlist); });
  const again = view.querySelector('#buyAgain');
  if (again) again.onclick = openBuyAgain;
}

function listRowHTML(it) {
  const sub = [];
  if (it.quantity != null) sub.push(qtyLabel(it.quantity, it.unit));
  if (it.note) sub.push(it.note);
  const recipe = it.sourceRecipeId ? state.recipes.find((r) => r.id === it.sourceRecipeId) : null;
  return `
    <div class="row ${it.checked ? 'is-checked' : ''}">
      <button class="check" data-check="${it.id}" role="checkbox" aria-checked="${!!it.checked}" aria-label="${it.checked ? 'Uncheck' : 'Check off'} ${esc(it.name)}">
        <span class="check-box">${ICON.check}</span>
      </button>
      <button class="row-main" data-editlist="${it.id}">
        <span class="row-name">${esc(it.name)}</span>
        ${sub.length ? `<span class="row-sub">${esc(sub.join(' · '))}</span>` : ''}
        ${recipe ? `<span class="row-note">for ${esc(recipe.title)}</span>` : ''}
      </button>
    </div>`;
}

function toggleChecked(id) {
  const it = state.list.find((i) => i.id === id);
  if (!it) return;

  if (it.checked) {
    it.checked = false;
    it.checkedAt = null;
    save();
    render();
    return;
  }

  it.checked = true;
  it.checkedAt = Date.now();
  recordPurchase(it);
  save();
  render();
  offerPantryTransfer(it);
}

/* Checking something off opens a prefilled confirm rather than silently
   adding to the pantry — you often buy a different size than you listed. */
function offerPantryTransfer(item) {
  const existing = state.pantry.find((p) => p.nameKey === item.nameKey);
  const body = `
    <p class="hint" style="margin-top:0">${existing
      ? `You already have <strong>${esc(existing.name)}</strong> (${esc(qtyLabel(existing.quantity, existing.unit) || '0')}). This adds to it.`
      : 'Adding this to what you have at home.'}</p>
    <div class="field">
      <label for="tQty">How much did you buy?</label>
      <input class="input" id="tQty" inputmode="decimal" value="${item.quantity != null ? formatQuantity(item.quantity) : '1'}">
    </div>
    <div class="field">
      <label for="tUnit">Unit</label>
      ${chipsHTML('tUnit', ALL_UNITS, item.unit || 'count', false)}
    </div>
    <div class="field">
      <label for="tLoc">Where does it go?</label>
      ${chipsHTML('tLoc', LOCATIONS, existing?.location || null, true)}
    </div>`;

  openSheet(`Add ${item.name} to pantry?`, body, 'Add to pantry', () => {
    const quantity = Number(String($('#tQty').value).replace(',', '.'));
    if (!Number.isFinite(quantity) || quantity < 0) { toast('Enter a quantity of zero or more.'); return; }
    const unit = readChips('tUnit') || 'count';
    const location = readChips('tLoc');

    const target = state.pantry.find((p) => p.nameKey === item.nameKey);
    if (target && target.unit === unit) {
      target.quantity = Math.round((target.quantity + quantity) * 100) / 100;
      target.updatedAt = Date.now();
      if (location) target.location = location;
    } else {
      state.pantry.push({
        id: uid(),
        name: item.name,
        nameKey: item.nameKey,
        quantity,
        unit,
        category: item.category || guessCategory(item.name),
        location,
        lowThreshold: null,
        createdAt: Date.now(),
        updatedAt: Date.now(),
      });
    }
    save();
    closeSheet();
    render();
    toast(`${item.name} added to pantry`);
  });
}

/* ---- buy it again ---------------------------------------------------- */
function openBuyAgain() {
  const items = buyAgainCandidates();

  if (!items.length) {
    const anyHistory = state.history.length > 0;
    toast(anyHistory ? 'Everything you buy often is already on the list.' : 'Nothing bought yet — check items off and they show up here.');
    return;
  }

  const rows = items.slice(0, 40).map((h, i) => {
    const when = h.lastBought ? daysAgo(h.lastBought) : '';
    return `
      <div class="row">
        <button class="check" data-again="${i}" role="checkbox" aria-checked="false" aria-label="Add ${esc(h.name)}">
          <span class="check-box">${ICON.check}</span>
        </button>
        <div class="row-main" style="cursor:default">
          <span class="row-name">${esc(h.name)}</span>
          <span class="row-sub">${esc(h.category || 'other')}${when ? ' · ' + esc(when) : ''} · bought ${h.count}×</span>
        </div>
      </div>`;
  }).join('');

  const body = `
    <p class="hint" style="margin-top:0">Things you’ve bought before, most often first. Tap what you need this trip.</p>
    <div class="rows" style="padding:0">${rows}</div>`;

  openSheet('Buy it again', body, 'Add to list', () => {
    let added = 0;
    items.slice(0, 40).forEach((h, i) => {
      const box = document.querySelector(`[data-again="${i}"]`);
      if (!box || box.getAttribute('aria-checked') !== 'true') return;
      if (state.list.some((x) => !x.checked && x.nameKey === h.nameKey)) return;

      state.list.push({
        id: uid(),
        name: h.name,
        nameKey: h.nameKey,
        quantity: h.quantity,
        unit: h.unit || 'count',
        note: null,
        category: h.category || guessCategory(h.name),
        checked: false,
        checkedAt: null,
        sourceRecipeId: null,
        addedAt: Date.now(),
      });
      added++;
    });

    if (!added) { toast('Nothing was selected.'); return; }
    save();
    closeSheet();
    render();
    toast(`Added ${added} item${added === 1 ? '' : 's'}`);
  });

  document.querySelectorAll('[data-again]').forEach((b) => {
    b.onclick = () => b.setAttribute('aria-checked', String(b.getAttribute('aria-checked') !== 'true'));
  });
}

function daysAgo(ts) {
  const days = Math.floor((Date.now() - ts) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 14) return `${days} days ago`;
  if (days < 60) return `${Math.floor(days / 7)} weeks ago`;
  return `${Math.floor(days / 30)} months ago`;
}

function editListItem(id) {
  const existing = id ? state.list.find((i) => i.id === id) : null;
  const body = `
    <div class="field">
      <label for="lName">Name</label>
      <input class="input" id="lName" placeholder="e.g. buttermilk" autocapitalize="none" value="${esc(existing?.name || '')}">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="lQty">Quantity</label>
        <input class="input" id="lQty" inputmode="decimal" placeholder="optional" value="${existing?.quantity != null ? formatQuantity(existing.quantity) : ''}">
        <p class="hint" id="lRecall"></p>
      </div>
    </div>
    <div class="field">
      <label for="lUnit">Unit</label>
      ${chipsHTML('lUnit', ALL_UNITS, existing?.unit || 'count', false)}
    </div>
    <div class="field">
      <label for="lNote">Note</label>
      <input class="input" id="lNote" placeholder="brand, size, “get the big one”" value="${esc(existing?.note || '')}">
    </div>
    <div class="field">
      <label for="lCat">Category</label>
      ${chipsHTML('lCat', ALL_CATEGORIES, existing?.category || null, true)}
    </div>`;

  openSheet(existing ? 'Edit list item' : 'Add to list', body, existing ? 'Save' : 'Add', () => {
    const name = $('#lName').value.trim();
    if (!name) { toast('Give the item a name.'); $('#lName').focus(); return; }
    const qtyRaw = String($('#lQty').value).trim();
    const quantity = qtyRaw === '' ? null : Number(qtyRaw.replace(',', '.'));
    if (quantity !== null && (!Number.isFinite(quantity) || quantity < 0)) { toast('Enter a quantity of zero or more.'); return; }

    const fields = {
      name,
      nameKey: normalizeName(name),
      quantity,
      unit: readChips('lUnit') || 'count',
      note: $('#lNote').value.trim() || null,
      category: readChips('lCat') || guessCategory(name),
    };

    if (existing) Object.assign(existing, fields);
    else state.list.push(Object.assign({ id: uid(), checked: false, checkedAt: null, sourceRecipeId: null, addedAt: Date.now() }, fields));

    save();
    closeSheet();
    render();
  }, existing ? `<button class="linkish" id="lDelete">Delete</button>` : '');

  if (!existing) {
    attachRecall({
      nameInput: $('#lName'),
      qtyInput: $('#lQty'),
      unitGroup: 'lUnit',
      catGroup: 'lCat',
      hintEl: $('#lRecall'),
    });
  }

  const del = $('#lDelete');
  if (del) del.onclick = () => {
    const removed = existing;
    state.list = state.list.filter((i) => i.id !== removed.id);
    save();
    closeSheet();
    render();
    toast(`Removed ${removed.name}`, 'Undo', () => { state.list.push(removed); save(); render(); });
  };
}

/* ══════════════════════════════════════════════════════════════════════
   RECIPES
   ══════════════════════════════════════════════════════════════════════ */
/** One row's status pill, shared by "mine" and the catalogue. */
function statusPill(recipe) {
  const s = summarize(recipe);
  if (s.missing > 0) return { state: 'missing', label: `${s.missing} missing` };
  if (s.short > 0) return { state: 'short', label: `${s.short} short` };
  if (s.unverified > 0) return { state: 'unverified', label: 'check amounts' };
  return { state: 'have', label: 'ready' };
}

function recipeRowHTML(recipe, attr) {
  const pill = statusPill(recipe);
  const mins = recipeMinutes(recipe);
  const gear = recipeEquipment(recipe);

  const meta = [];
  if (mins) meta.push(formatMinutes(mins));
  meta.push(gear.slice(0, 2).join(' + '));
  if (recipe.servings) meta.push(`serves ${recipe.servings}`);
  return `
    <div class="row" data-state="${pill.state}">
      <button class="row-main" ${attr}="${recipe.id}">
        <span class="row-name">${esc(recipe.title)}</span>
        <span class="row-sub">${esc(meta.join(' · '))}</span>
      </button>
      <span class="pill" data-state="${pill.state}" style="margin-right:14px">${esc(pill.label)}</span>
    </div>`;
}

function renderRecipes() {
  const view = $('#view-recipes');

  if (recipeOpenId) { renderRecipeDetail(view, recipeOpenId); return; }
  if (catalogueOpenId) { renderCatalogueDetail(view, catalogueOpenId); return; }

  const tabs = `
    <div class="toolbar">
      <div class="segment" style="flex:1" role="group" aria-label="Recipe source">
        <button type="button" data-rtab="mine" style="flex:1" aria-pressed="${recipesTab === 'mine'}">My recipes${state.recipes.length ? ` (${state.recipes.length})` : ''}</button>
        <button type="button" data-rtab="browse" style="flex:1" aria-pressed="${recipesTab === 'browse'}">Browse (${CATALOGUE.length})</button>
      </div>
    </div>`;

  view.innerHTML = recipesTab === 'browse' ? tabs + browseHTML() : tabs + mineHTML();

  view.querySelectorAll('[data-rtab]').forEach((b) => {
    b.onclick = () => { recipesTab = b.dataset.rtab; renderRecipes(); };
  });
  view.querySelectorAll('[data-openrecipe]').forEach((b) => {
    b.onclick = () => { recipeOpenId = b.dataset.openrecipe; render(); };
  });
  view.querySelectorAll('[data-opencat]').forEach((b) => {
    b.onclick = () => { catalogueOpenId = b.dataset.opencat; render(); };
  });
  view.querySelectorAll('[data-cfilter]').forEach((b) => {
    b.onclick = () => { catalogueFilter = b.dataset.cfilter; renderRecipes(); };
  });
  view.querySelectorAll('[data-gear]').forEach((b) => {
    b.onclick = () => { catalogueGear = b.dataset.gear; renderRecipes(); };
  });

  const search = view.querySelector('#catSearch');
  if (search) {
    search.oninput = () => {
      catalogueQuery = search.value;
      const list = view.querySelector('#catList');
      if (list) list.innerHTML = catalogueListHTML();
      wireCatalogueRows(view);
      const count = view.querySelector('#catCount');
      if (count) count.textContent = `${searchCatalogue(catalogueQuery, catalogueFilter).length}`;
    };
    // Keep the caret where it was while typing.
    search.value = catalogueQuery;
  }
  const browseBtn = view.querySelector('#goBrowse');
  if (browseBtn) browseBtn.onclick = () => { recipesTab = 'browse'; renderRecipes(); };
}

function wireCatalogueRows(view) {
  view.querySelectorAll('[data-opencat]').forEach((b) => {
    b.onclick = () => { catalogueOpenId = b.dataset.opencat; render(); };
  });
}

function mineHTML() {
  const recipes = [...state.recipes].sort((a, b) => b.createdAt - a.createdAt);

  if (!recipes.length) {
    return `<div class="empty">
      <h3>No recipes of your own yet</h3>
      <p>Paste one from any site with the + button, or take something from the browse list.</p>
      <button class="btn btn-primary" id="goBrowse" style="margin-top:20px;max-width:280px">Browse ${CATALOGUE.length} recipes</button>
    </div>`;
  }
  return `<div class="rows">${recipes.map((r) => recipeRowHTML(r, 'data-openrecipe')).join('')}</div>`;
}

function catalogueListHTML() {
  const results = searchCatalogue(catalogueQuery, catalogueFilter);

  if (!results.length) {
    return `<div class="empty">
      <h3>Nothing matches</h3>
      <p>${catalogueFilter === 'ready'
        ? 'Nothing here can be made from what’s at home right now. Try “Almost” or clear the filter.'
        : 'Try a different search.'}</p>
    </div>`;
  }
  return results.map((r) => {
    const owned = inMyRecipes(r);
    const row = recipeRowHTML(r, 'data-opencat');
    return owned ? row.replace('class="row-name"', 'class="row-name" data-owned="1"') : row;
  }).join('');
}

function browseHTML() {
  const count = searchCatalogue(catalogueQuery, catalogueFilter).length;
  return `
    <div style="padding:0 20px 10px">
      <input class="input" id="catSearch" type="search" placeholder="Search recipes or an ingredient" autocapitalize="none" autocorrect="off" value="${esc(catalogueQuery)}">
    </div>
    <div class="toolbar" style="padding-top:0">
      <div class="segment" style="flex:1" role="group" aria-label="Filter recipes">
        <button type="button" data-cfilter="all" style="flex:1" aria-pressed="${catalogueFilter === 'all'}">All</button>
        <button type="button" data-cfilter="ready" style="flex:1" aria-pressed="${catalogueFilter === 'ready'}">Can make now</button>
        <button type="button" data-cfilter="almost" style="flex:1" aria-pressed="${catalogueFilter === 'almost'}">Almost</button>
      </div>
    </div>
    <div style="padding:0 20px 4px">
      <div class="chips" role="group" aria-label="What you cook it with">
        <button type="button" class="chip" data-gear="any" aria-pressed="${catalogueGear === 'any'}">Anything</button>
        ${gearCounts().map(({ key, label, n }) =>
          `<button type="button" class="chip" data-gear="${esc(key)}" aria-pressed="${catalogueGear === key}">${esc(label)} ${n}</button>`
        ).join('')}
      </div>
    </div>
    <div class="section-head"><h2>${catalogueFilter === 'ready' ? 'Ready to cook' : catalogueFilter === 'almost' ? 'One or two short' : 'All recipes'}</h2><span class="section-count" id="catCount">${count}</span></div>
    <div class="rows" id="catList">${catalogueListHTML()}</div>`;
}

function renderCatalogueDetail(view, id) {
  const r = CATALOGUE.find((x) => x.id === id);
  if (!r) { catalogueOpenId = null; renderRecipes(); return; }

  const owned = inMyRecipes(r);
  const s = summarize(r);

  const rows = scaledIngredients(r).map((ing) => {
    const a = availabilityFor(ing, state.pantry, state.aliases);
    const detail = [];
    if (ing.quantity != null) detail.push(qtyLabel(ing.quantity, ing.unit));
    if (ing.prep) detail.push(ing.prep);
    return `
      <div class="row" data-state="${a.state}">
        <div class="row-main" style="cursor:default">
          <span class="row-name">${esc(ing.name)}</span>
          ${detail.length ? `<span class="row-sub">${esc(detail.join(' · '))}</span>` : ''}
        </div>
        <span class="pill" data-state="${a.state}" style="margin-right:14px">${STATE_LABEL[a.state]}</span>
      </div>`;
  }).join('');

  view.innerHTML = `
    <div class="toolbar" style="padding-top:0">
      <button class="linkish" id="backToBrowse">‹ Browse</button>
    </div>
    <div class="recipe-head">
      <h2 class="recipe-title">${esc(r.title)}</h2>
      <div class="recipe-meta">
        <span>${r.servings ? `Serves ${r.servings}` : 'Servings not given'}</span>
        <span>· ${r.steps.length} step${r.steps.length === 1 ? '' : 's'}</span>
        ${r.tags.length ? `<span>· ${esc(r.tags.join(', '))}</span>` : ''}
      </div>
    </div>
    <div class="summary-bar">
      ${s.have ? `<span class="pill" data-state="have">${s.have} have</span>` : ''}
      ${s.short ? `<span class="pill" data-state="short">${s.short} short</span>` : ''}
      ${s.missing ? `<span class="pill" data-state="missing">${s.missing} missing</span>` : ''}
      ${s.unverified ? `<span class="pill" data-state="unverified">${s.unverified} unverified</span>` : ''}
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" id="takeRecipe" style="flex:1">${owned ? 'Open in my recipes' : 'Add to my recipes'}</button>
      <button class="btn" id="catToPlan" style="flex:1">Add to this week</button>
    </div>
    <div class="section-head"><h2>Ingredients</h2><span class="section-count">${r.ingredients.length}</span></div>
    <div class="rows">${rows}</div>
    <div class="section-head"><h2>Method</h2></div>
    <ol class="steps">${r.steps.map((st) => `<li>${esc(st.text)}</li>`).join('')}</ol>`;

  $('#backToBrowse').onclick = () => { catalogueOpenId = null; render(); };
  $('#catToPlan').onclick = () => {
    // Planning implies owning it, so the copy happens here rather than
    // leaving the plan pointing at something that is not in your recipes.
    addToPlan(addFromCatalogue(r));
    render();
    toast(`${r.title} added to this week`, 'View week', () => setTab('plan'));
  };
  $('#takeRecipe').onclick = () => {
    const id = addFromCatalogue(r);
    catalogueOpenId = null;
    recipesTab = 'mine';
    recipeOpenId = id;
    render();
    if (!owned) toast(`${r.title} added to your recipes`);
  };
}

function summarize(recipe) {
  let missing = 0, short = 0, unverified = 0, have = 0;
  for (const ing of scaledIngredients(recipe)) {
    const a = availabilityFor(ing, state.pantry, state.aliases);
    if (a.state === 'missing' || a.state === 'unmatched') missing++;
    else if (a.state === 'short') short++;
    else if (a.state === 'unverified') unverified++;
    else have++;
  }
  return { missing, short, unverified, have };
}

/* "missing" and "unmatched" stay separate internally — only a genuinely
   unknown ingredient gets the "link to a pantry item" tap — but they read the
   same, because having none of something and never having had it are the same
   fact to a cook. */
const STATE_LABEL = {
  have: 'have', short: 'short', missing: 'not in pantry',
  unverified: 'amount unverified', unmatched: 'not in pantry',
};

function renderRecipeDetail(view, id) {
  const r = state.recipes.find((x) => x.id === id);
  if (!r) { recipeOpenId = null; renderRecipes(); return; }

  const rows = scaledIngredients(r).map((ing) => {
    const a = availabilityFor(ing, state.pantry, state.aliases);
    const detail = [];
    if (ing.quantity != null) detail.push(qtyLabel(ing.quantity, ing.unit));
    if (ing.prep) detail.push(ing.prep);
    if (a.state === 'short' && a.haveInNeedUnit != null) detail.push(`have ${formatQuantity(a.haveInNeedUnit)}`);
    if (a.state === 'have' && a.match) detail.push(`have ${qtyLabel(a.match.quantity, a.match.unit)}`);
    if (a.converted) detail.push('converted');
    return { ing, a, detail };
  });

  const s = summarize(r);
  const actionable = rows.filter(({ a }) => a.state === 'missing' || a.state === 'unmatched' || a.state === 'short');

  let html = `
    <div class="toolbar" style="padding-top:0">
      <button class="linkish" id="backToRecipes">‹ All recipes</button>
      <button class="linkish" id="deleteRecipe">Delete</button>
    </div>
    <div class="recipe-head">
      <h2 class="recipe-title">${esc(r.title)}</h2>
      <div class="recipe-meta">
        ${recipeMinutes(r) ? `<span>${esc(formatMinutes(recipeMinutes(r)))}</span><span>·</span>` : ''}
        <span>${esc(recipeEquipment(r).join(' + '))}</span>
        <span>· ${r.steps.length} step${r.steps.length === 1 ? '' : 's'}</span>
        ${!r.servings && r.yieldText ? `<span>· source said “${esc(r.yieldText)}”</span>` : ''}
      </div>
    </div>
    <div class="scale-bar">
      <div>
        <span class="scale-label">${esc(scaleLabel(r))}</span>
        ${scaleOf(r) !== 1 ? `<span class="scale-note">scaled from ${r.servings ? `${r.servings} servings` : 'the full recipe'}</span>` : `<span class="scale-note">tap − or + to make more or less</span>`}
      </div>
      <div class="stepper stepper-compact">
        <button id="scaleDown" aria-label="Make less">${ICON.minus}</button>
        <button id="scaleReset" class="scale-reset" aria-label="Reset to the full recipe">${formatQuantity(scaleOf(r))}×</button>
        <button id="scaleUp" aria-label="Make more">${ICON.plus}</button>
      </div>
    </div>
    <div class="summary-bar">
      ${s.have ? `<span class="pill" data-state="have">${s.have} have</span>` : ''}
      ${s.short ? `<span class="pill" data-state="short">${s.short} short</span>` : ''}
      ${s.missing ? `<span class="pill" data-state="missing">${s.missing} missing</span>` : ''}
      ${s.unverified ? `<span class="pill" data-state="unverified">${s.unverified} unverified</span>` : ''}
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" id="startCooking" style="flex:1">Start cooking</button>
      <button class="btn" id="madeIt" style="flex:1">I made this</button>
    </div>
    <div class="toolbar" style="padding-top:0">
      <button class="btn" id="planAdd" style="flex:1">${state.plan.some((p) => p.recipeId === r.id) ? 'Add another batch to this week' : 'Add to this week'}</button>
    </div>
    <div class="section-head"><h2>Ingredients</h2><span class="section-count">${r.ingredients.length}</span></div>
    <div class="rows">`;

  for (const { ing, a, detail } of rows) {
    html += `
      <div class="row" data-state="${a.state}">
        <button class="row-main" ${a.state === 'unmatched' ? `data-link="${esc(ing.nameKey)}"` : 'disabled style="cursor:default"'}>
          <span class="row-name">${esc(ing.name)}${ing.optional ? ' <span class="row-sub">(optional)</span>' : ''}</span>
          ${detail.length ? `<span class="row-sub">${esc(detail.join(' · '))}</span>` : ''}
          ${a.state === 'unmatched' ? `<span class="row-note">tap to link to a pantry item</span>` : ''}
        </button>
        <span class="pill" data-state="${a.state}" style="margin-right:14px">${STATE_LABEL[a.state]}</span>
      </div>`;
  }

  html += `</div>`;

  if (actionable.length) {
    html += `<div class="toolbar" style="padding-top:16px">
      <button class="btn" id="addMissing" style="flex:1">Add ${actionable.length} to shopping list</button>
    </div>`;
  }

  if (r.steps.length) {
    html += `<div class="section-head"><h2>Method</h2></div><ol class="steps">`;
    for (const st of r.steps) html += `<li>${esc(st.text)}</li>`;
    html += `</ol>`;
  }

  view.innerHTML = html;

  $('#backToRecipes').onclick = () => { recipeOpenId = null; render(); };
  $('#startCooking').onclick = () => openCook(r.id);
  $('#madeIt').onclick = () => openMadeIt(r);
  $('#planAdd').onclick = () => {
    addToPlan(r.id);
    render();
    toast(`${r.title} added to this week`, 'View week', () => setTab('plan'));
  };
  const rescale = (dir) => { stepScale(r, dir); save(); render(); };
  $('#scaleDown').onclick = () => rescale(-1);
  $('#scaleUp').onclick = () => rescale(1);
  $('#scaleReset').onclick = () => {
    if (scaleOf(r) !== 1) { r.scale = 1; save(); render(); }
    else promptServings(r);
  };
  $('#deleteRecipe').onclick = () => {
    const removed = r;
    state.recipes = state.recipes.filter((x) => x.id !== removed.id);
    recipeOpenId = null;
    save();
    render();
    toast(`Deleted ${removed.title}`, 'Undo', () => { state.recipes.push(removed); save(); render(); });
  };

  const addBtn = $('#addMissing');
  if (addBtn) addBtn.onclick = () => addMissingToList(r, rows);

  view.querySelectorAll('[data-link]').forEach((b) => { b.onclick = () => linkIngredient(b.dataset.link); });
}

function promptServings(r) {
  const body = `
    <div class="field">
      <label for="sv">Servings</label>
      <input class="input" id="sv" inputmode="numeric" placeholder="leave blank if unknown" value="${r.servings || ''}">
      ${r.yieldText ? `<p class="hint">The source said “${esc(r.yieldText)}”.</p>` : ''}
    </div>`;
  openSheet('How many does this serve?', body, 'Save', () => {
    const raw = $('#sv').value.trim();
    r.servings = raw === '' ? null : Math.max(1, Math.round(Number(raw))) || null;
    save();
    closeSheet();
    render();
  });
}

/* Missing goes on in full; short goes on as the shortfall only.
   Unverified is deliberately excluded — you probably have it. */
function addMissingToList(recipe, rows) {
  let added = 0;
  for (const { ing, a } of rows) {
    if (a.state === 'unverified' || a.state === 'have') continue;

    let quantity = ing.quantity;
    if (a.state === 'short' && a.shortfall != null) quantity = Math.round(a.shortfall * 100) / 100;

    const dupe = state.list.find((i) => !i.checked && i.nameKey === ing.nameKey && i.sourceRecipeId === recipe.id);
    if (dupe) continue;

    state.list.push({
      id: uid(),
      name: ing.name,
      nameKey: ing.nameKey,
      quantity,
      unit: ing.unit || 'count',
      note: null,
      category: guessCategory(ing.name),
      checked: false,
      checkedAt: null,
      sourceRecipeId: recipe.id,
      addedAt: Date.now(),
    });
    added++;
  }
  save();
  render();
  toast(added ? `Added ${added} item${added === 1 ? '' : 's'} to your list` : 'Already on your list', 'View', () => setTab('list'));
}

/* The user-taught alias: what makes imperfect matching livable. */
function linkIngredient(nameKey) {
  if (!state.pantry.length) { toast('Your pantry is empty — nothing to link to yet.'); return; }
  const options = [...state.pantry].sort((a, b) => a.name.localeCompare(b.name));
  const body = `
    <p class="hint" style="margin-top:0">Mise couldn’t match this to anything at home. Pick what it is and it’ll remember for every recipe.</p>
    <div class="field">
      ${chipsHTML('linkTo', options.map((p) => p.name), null, false)}
    </div>`;
  openSheet('Link to a pantry item', body, 'Link', () => {
    const chosenName = readChips('linkTo');
    if (!chosenName) { toast('Pick a pantry item.'); return; }
    const chosen = options.find((p) => p.name === chosenName);
    state.aliases[nameKey] = chosen.nameKey;
    save();
    closeSheet();
    render();
    toast(`Linked to ${chosen.name}`);
  });
}

/* ---- recipe entry / paste import ------------------------------------ */
function editRecipe(id, prefill) {
  const existing = id ? state.recipes.find((r) => r.id === id) : null;

  const seedTitle    = existing?.title ?? prefill?.title ?? '';
  const seedServings = existing?.servings ?? prefill?.servings ?? '';
  const seedIng      = existing ? existing.ingredients.map((i) => i.raw).join('\n') : (prefill?.ingredients || []).join('\n');
  const seedSteps    = existing ? existing.steps.map((s) => s.text).join('\n')      : (prefill?.steps || []).join('\n');
  const seedYield    = existing?.yieldText ?? prefill?.yieldText ?? null;

  const body = `
    ${prefill ? `<p class="hint" style="margin-top:0">Read ${esc(prefill.ingredients.length)} ingredient${prefill.ingredients.length === 1 ? '' : 's'} and ${esc(prefill.steps.length)} step${prefill.steps.length === 1 ? '' : 's'} from ${esc(prefill.via)}. Check it over before saving.</p>` : ''}
    <div class="field">
      <label for="rTitle">Title</label>
      <input class="input" id="rTitle" placeholder="e.g. Weeknight chile verde" value="${esc(seedTitle)}">
    </div>
    <div class="field">
      <label for="rServings">Servings</label>
      <input class="input" id="rServings" inputmode="numeric" placeholder="leave blank if you're not sure" value="${esc(seedServings)}">
      ${!seedServings && seedYield ? `<p class="hint">The source said “${esc(seedYield)}” — fill in a number if you want one.</p>` : ''}
    </div>
    <div class="field">
      <label for="rIng">Ingredients — one per line</label>
      <textarea class="input" id="rIng" placeholder="2 large eggs, beaten&#10;1 1/2 cups all-purpose flour&#10;3 cloves garlic, minced">${esc(seedIng)}</textarea>
      <p class="hint">Mise pulls out the amount, unit and name from each line.</p>
    </div>
    <div class="field">
      <label for="rSteps">Method — one step per line</label>
      <textarea class="input" id="rSteps" placeholder="Whisk the eggs and sugar until pale.&#10;Bake for 20 minutes until golden.">${esc(seedSteps)}</textarea>
      <p class="hint">Any step mentioning a time gets a timer button in Cook Mode.</p>
    </div>`;

  openSheet(existing ? 'Edit recipe' : 'Add a recipe', body, existing ? 'Save' : 'Add recipe', () => {
    const title = $('#rTitle').value.trim();
    if (!title) { toast('Give the recipe a title.'); $('#rTitle').focus(); return; }

    const ingredients = $('#rIng').value.split('\n').map((l) => l.trim()).filter(Boolean).map(parseIngredient);
    const steps = $('#rSteps').value.split('\n').map((l) => l.trim()).filter(Boolean)
      .map((text) => ({ text, timerSeconds: detectTimer(text) }));

    const svRaw = $('#rServings').value.trim();
    const servings = svRaw === '' ? null : Math.max(1, Math.round(Number(svRaw))) || null;

    if (existing) {
      Object.assign(existing, { title, servings, ingredients, steps });
    } else {
      state.recipes.push({
        id: uid(), title, servings, yieldText: seedYield, sourceUrl: null,
        ingredients, steps, createdAt: Date.now(),
      });
    }
    save();
    closeSheet();
    render();
  });
}

/* ---- "I made this" UI ----------------------------------------------- */
const DEDUCT_NOTE = {
  'unmatched': 'not in your pantry',
  'none-left': 'you have none left',
  'unknown-amount': 'no amount given — skipped',
  'unconvertible': "can't convert to your unit — skipped",
  'more-than-you-have': 'more than you have; will empty it',
};

function openMadeIt(recipe) {
  const plan = deductionPlan(recipe, state.pantry, state.aliases);
  const usable = plan.filter((p) => p.amount !== null);

  if (!usable.length) {
    toast('Nothing here matches your pantry yet.');
    return;
  }

  const rows = plan.map((p, i) => {
    const can = p.amount !== null;
    const note = DEDUCT_NOTE[p.status];
    return `
      <div class="row" data-state="${can ? (p.status === 'more-than-you-have' ? 'short' : 'have') : 'unmatched'}">
        <button class="check" data-dcheck="${i}" role="checkbox" aria-checked="${can}" ${can ? '' : 'disabled style="opacity:.4"'} aria-label="Use ${esc(p.ing.name)}">
          <span class="check-box">${ICON.check}</span>
        </button>
        <div class="row-main" style="cursor:default">
          <span class="row-name">${esc(p.ing.name)}</span>
          <span class="row-sub">${can
            ? `take ${esc(formatQuantity(p.amount))} ${esc(unitLabel(p.match.unit) || 'x')} of ${esc(formatQuantity(p.match.quantity))}${p.converted ? ' · converted' : ''}${note ? ' · ' + esc(note) : ''}`
            : esc(note || 'skipped')}</span>
        </div>
      </div>`;
  }).join('');

  const body = `
    <p class="hint" style="margin-top:0">Taking these out of what’s at home. Uncheck anything you didn’t actually use.</p>
    <div class="rows" style="padding:0">${rows}</div>`;

  openSheet(`Made ${recipe.title}?`, body, 'Take from pantry', () => {
    const undo = JSON.parse(JSON.stringify(state.pantry));
    let used = 0;
    const emptied = [];

    plan.forEach((p, i) => {
      if (p.amount === null) return;
      const box = document.querySelector(`[data-dcheck="${i}"]`);
      if (!box || box.getAttribute('aria-checked') !== 'true') return;

      const target = state.pantry.find((x) => x.id === p.match.id);
      if (!target) return;

      const next = Math.max(0, Math.round((target.quantity - p.amount) * 100) / 100);
      if (next === 0 && target.quantity > 0) emptied.push(target.name);
      target.quantity = next;
      target.updatedAt = Date.now();
      used++;
    });

    pruneZeroed();
    save();
    closeSheet();
    render();

    if (!used) { toast('Nothing was checked.'); return; }

    // Running out is exactly when you want it on the shopping list.
    if (emptied.length) {
      toast(`${used} taken · ${emptied.length} ran out`, 'Add to list', () => {
        const n = addNamesToList(emptied);
        save();
        render();
        toast(`${n} added to your list`);
      });
    } else {
      toast(`Took ${used} ingredient${used === 1 ? '' : 's'} from your pantry`, 'Undo', () => {
        state.pantry = undo; save(); render();
      });
    }
  });

  document.querySelectorAll('[data-dcheck]:not([disabled])').forEach((b) => {
    b.onclick = () => b.setAttribute('aria-checked', String(b.getAttribute('aria-checked') !== 'true'));
  });
}

/* ---- paste import UI ------------------------------------------------ */
function chooseRecipeSource() {
  const body = `
    <p class="hint" style="margin-top:0">Two ways in.</p>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="btn btn-primary" id="srcPaste" style="min-height:56px">Paste a recipe</button>
      <button class="btn" id="srcHand" style="min-height:56px">Write it by hand</button>
    </div>
    <p class="hint">Pasting works with a recipe page’s text, or the whole page source if you copy that — Mise reads the structured recipe data most sites publish.</p>`;

  openSheet('Add a recipe', body, 'Close', closeSheet);
  $('#srcPaste').onclick = () => { closeSheet(); importRecipe(); };
  $('#srcHand').onclick  = () => { closeSheet(); editRecipe(null); };
}

function importRecipe() {
  const body = `
    <div class="field">
      <label for="impText">Paste the recipe</label>
      <textarea class="input" id="impText" style="min-height:190px" placeholder="Open the recipe in Safari, Select All, Copy — then paste here."></textarea>
      <p class="hint">Mise looks for the structured recipe data most sites publish, and falls back to reading the plain text. It never sends anything anywhere — this all happens on your phone.</p>
    </div>`;

  openSheet('Paste a recipe', body, 'Read it', () => {
    const text = $('#impText').value.trim();
    if (!text) { toast('Paste something first.'); $('#impText').focus(); return; }

    const parsed = parsePastedRecipes(text);
    if (!parsed.length) {
      toast("Couldn't find a recipe in that. Try writing it by hand.");
      return;
    }
    closeSheet();

    // One recipe goes straight to the editor for review. Several go to a
    // list, since reviewing ten in a form would be worse than reviewing none.
    if (parsed.length === 1) editRecipe(null, parsed[0]);
    else reviewImportedRecipes(parsed);
  });
}

/** Review sheet for a paste containing several recipes. */
function reviewImportedRecipes(parsed) {
  const rows = parsed.map((p, i) => `
    <div class="row">
      <button class="check" data-icheck="${i}" role="checkbox" aria-checked="true" aria-label="Import ${esc(p.title)}">
        <span class="check-box">${ICON.check}</span>
      </button>
      <div class="row-main" style="cursor:default">
        <span class="row-name">${esc(p.title)}</span>
        <span class="row-sub">${p.ingredients.length} ingredient${p.ingredients.length === 1 ? '' : 's'} · ${p.steps.length} step${p.steps.length === 1 ? '' : 's'}${p.servings ? ` · serves ${p.servings}` : ''}</span>
      </div>
    </div>`).join('');

  const body = `
    <p class="hint" style="margin-top:0">Found ${parsed.length} recipes. Uncheck anything you don’t want — you can edit each one after it’s added.</p>
    <div class="rows" style="padding:0">${rows}</div>`;

  openSheet(`Import ${parsed.length} recipes`, body, `Add them`, () => {
    let added = 0;
    parsed.forEach((p, i) => {
      const box = document.querySelector(`[data-icheck="${i}"]`);
      if (!box || box.getAttribute('aria-checked') !== 'true') return;
      if (state.recipes.some((r) => r.title === p.title)) return;

      state.recipes.push({
        id: uid(),
        title: p.title,
        servings: p.servings ?? null,
        yieldText: p.yieldText ?? null,
        sourceUrl: null,
        ingredients: p.ingredients.map(parseIngredient),
        steps: p.steps.map((text) => ({ text, timerSeconds: detectTimer(text) })),
        createdAt: Date.now(),
      });
      added++;
    });

    save();
    closeSheet();
    recipesTab = 'mine';
    render();
    toast(added ? `Added ${added} recipe${added === 1 ? '' : 's'}` : 'Nothing was selected');
  });

  document.querySelectorAll('[data-icheck]').forEach((b) => {
    b.onclick = () => b.setAttribute('aria-checked', String(b.getAttribute('aria-checked') !== 'true'));
  });
}

/** Parsed once at startup; the browse list reads from this. */
const CATALOGUE = CATALOGUE_RAW.map((r, i) => ({
  id: `cat-${i}`,
  title: r.title,
  servings: r.servings ?? null,
  tags: r.tags || [],
  yieldText: null,
  sourceUrl: null,
  createdAt: 0,
  ingredients: r.ingredients.map(parseIngredient),
  steps: r.steps.map((text) => ({ text, timerSeconds: detectTimer(text) })),
}));

/** Copies a catalogue recipe into your own, so it can be edited and cooked. */
function addFromCatalogue(cat) {
  const already = state.recipes.find((r) => r.title === cat.title);
  if (already) return already.id;

  const copy = {
    id: uid(),
    title: cat.title,
    servings: cat.servings,
    yieldText: null,
    sourceUrl: null,
    ingredients: JSON.parse(JSON.stringify(cat.ingredients)),
    steps: JSON.parse(JSON.stringify(cat.steps)),
    createdAt: Date.now(),
  };
  state.recipes.push(copy);
  save();
  return copy.id;
}

const inMyRecipes = (cat) => state.recipes.some((r) => r.title === cat.title);

/** Appliance chips, commonest first, with how many recipes use each. */
function gearCounts() {
  const counts = new Map();
  for (const r of CATALOGUE) {
    for (const k of recipeEquipment(r)) counts.set(k, (counts.get(k) || 0) + 1);
  }
  const labels = Object.fromEntries(EQUIPMENT.map((e) => [e.key, e.label]));
  labels['no cook'] = 'No cook';
  return [...counts.entries()]
    .sort((a, b) => b[1] - a[1])
    .map(([key, n]) => ({ key, label: labels[key] || key, n }));
}

/* ---- scaling ---------------------------------------------------------
   Halving a recipe rather than cooking twenty pancakes for one person.
   The scale is stored on the recipe, and every consumer — availability,
   the shopping list, the week plan, "I made this" — reads the scaled
   ingredients, so what you see is what gets bought and deducted. */
const SCALE_STEPS = [0.25, 0.5, 0.75, 1, 1.5, 2, 3, 4];

const scaleOf = (recipe) => (recipe.scale && recipe.scale > 0 ? recipe.scale : 1);

function scaledIngredients(recipe, extra = 1) {
  const k = scaleOf(recipe) * extra;
  if (k === 1) return recipe.ingredients;
  return recipe.ingredients.map((i) => ({
    ...i,
    quantity: i.quantity == null ? null : Math.round(i.quantity * k * 1000) / 1000,
  }));
}

function scaledServings(recipe) {
  if (!recipe.servings) return null;
  return Math.max(1, Math.round(recipe.servings * scaleOf(recipe)));
}

function scaleLabel(recipe) {
  const servings = scaledServings(recipe);
  if (servings) return `Serves ${servings}`;
  const k = scaleOf(recipe);
  return k === 1 ? 'Full recipe' : `${formatQuantity(k)}× recipe`;
}

function stepScale(recipe, direction) {
  const current = scaleOf(recipe);
  const i = SCALE_STEPS.findIndex((s) => Math.abs(s - current) < 0.001);
  const next = i === -1
    ? 1
    : SCALE_STEPS[Math.min(SCALE_STEPS.length - 1, Math.max(0, i + direction))];
  recipe.scale = next;
}

/** Title and ingredient names both count, so "chicken" finds what uses it. */
function searchCatalogue(query, filter) {
  const q = query.trim().toLowerCase();

  return CATALOGUE.filter((r) => {
    if (q) {
      const haystack = [r.title, ...r.tags, ...r.ingredients.map((i) => i.name)].join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    if (catalogueGear !== 'any' && !recipeEquipment(r).includes(catalogueGear)) return false;
    if (filter === 'ready') {
      const s = summarize(r);
      return s.missing === 0 && s.short === 0;
    }
    if (filter === 'almost') {
      const s = summarize(r);
      return s.missing + s.short > 0 && s.missing + s.short <= 2;
    }
    return true;
  });
}

  let durable = false;
  try { durable = !!(navigator.storage && navigator.storage.persisted && await navigator.storage.persisted()); } catch {}

  const zeroed = state.pantry.filter((p) => p.quantity <= 0).length;

  const body = `
    <p class="hint" style="margin-top:0">${esc(counts)}</p>
    <div class="field">
      <label>When something hits zero</label>
      <div class="segment" style="width:100%" role="group" aria-label="When something hits zero">
        <button type="button" data-zero="keep" style="flex:1" aria-pressed="${!state.settings.removeAtZero}">Keep it at 0</button>
        <button type="button" data-zero="remove" style="flex:1" aria-pressed="${state.settings.removeAtZero}">Remove it</button>
      </div>
      <p class="hint">Keeping it leaves a reminder of something you normally stock. Removing it keeps the pantry to what you actually have — either way, Mise offers to put it on your shopping list.${zeroed ? ` <strong>${zeroed} item${zeroed === 1 ? ' is' : 's are'} at zero right now.</strong>` : ''}</p>
    </div>
    <div class="field">
      <label>Keep a copy</label>
      <div style="display:flex;flex-direction:column;gap:9px">
        <button class="btn btn-primary" id="bkSave" style="min-height:50px">Save a backup file</button>
        <button class="btn" id="bkCopy" style="min-height:50px">Copy backup to clipboard</button>
      </div>
      <p class="hint">Saving here: <strong>${STORAGE_STATE === 'ok' ? 'working' : STORAGE_STATE === 'blocked' ? 'blocked by this browser' : 'temporary — will not survive closing'}</strong>${STORAGE_STATE === 'ok' ? (durable ? ' · marked durable' : ' · not marked durable, so add Mise to your Home Screen') : ''}.</p>
      <p class="hint">Your data lives on this device only and is never uploaded.</p>
    </div>
    <div class="field">
      <label for="bkPaste">Restore from a backup</label>
      <textarea class="input" id="bkPaste" style="min-height:110px" placeholder="Paste a backup here to replace everything currently in the app."></textarea>
      <button class="btn" id="bkRestore" style="margin-top:9px">Restore</button>
      <p class="hint">Restoring replaces your current pantry, list and recipes.</p>
    </div>`;

  openSheet('Settings', body, 'Done', closeSheet);

  document.querySelectorAll('[data-zero]').forEach((b) => {
    b.onclick = () => {
      const remove = b.dataset.zero === 'remove';
      state.settings.removeAtZero = remove;
      document.querySelectorAll('[data-zero]').forEach((x) =>
        x.setAttribute('aria-pressed', String((x.dataset.zero === 'remove') === remove))
      );

      const removed = remove ? pruneZeroed() : [];
      save();
      render();

      if (removed.length) {
        toast(`${removed.length} emptied item${removed.length === 1 ? '' : 's'} removed`, 'Add to list', () => {
          const n = addNamesToList(removed);
          save();
          render();
          toast(`${n} added to your list`);
        });
      }
    };
  });

  $('#bkSave').onclick = async () => {
    const filename = backupFilename();
    const payload = backupPayload();

    // Inside a Claude artifact the page cannot start its own download and has
    // to ask the host. Served from a normal web host there is no host to ask,
    // and an object-URL link is the way — on iOS this lands in Files.
    const host = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (host) {
      try {
        await host.save({ filename, data: payload });
        toast('Backup saved');
      } catch {
        toast('Save was cancelled — Copy still works.');
      }
      return;
    }

    try {
      const url = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast('Backup downloaded');
    } catch {
      toast('Download was blocked — use Copy to clipboard instead.');
    }
  };

  $('#bkCopy').onclick = async () => {
    const payload = backupPayload();
    try {
      await navigator.clipboard.writeText(payload);
      toast('Backup copied — paste it somewhere safe');
    } catch {
      const ta = $('#bkPaste');
      ta.value = payload;
      ta.select();
      toast('Copy blocked — the backup is in the box, copy it manually');
    }
  };

  $('#bkRestore').onclick = () => {
    const text = $('#bkPaste').value.trim();
    if (!text) { toast('Paste a backup first.'); return; }
    const result = applyBackup(text);
    if (!result.ok) { toast(result.error); return; }
    closeSheet();
    recipeOpenId = null;
    render();
    toast(`Restored ${result.counts.pantry} pantry items and ${result.counts.recipes} recipes`);
  };
}

/* ══════════════════════════════════════════════════════════════════════
   WEEK PLAN
   ══════════════════════════════════════════════════════════════════════ */
function addToPlan(recipeId) {
  const already = state.plan.find((p) => p.recipeId === recipeId);
  if (already) {
    already.batches = (already.batches || 1) + 1;
  } else {
    state.plan.push({ id: uid(), recipeId, batches: 1, cooked: false, addedAt: Date.now() });
  }
  save();
}

function renderPlan() {
  const view = $('#view-plan');
  const entries = state.plan
    .map((e) => ({ entry: e, recipe: state.recipes.find((r) => r.id === e.recipeId) }))
    .filter((x) => x.recipe);

  if (!entries.length) {
    view.innerHTML = `<div class="empty">
      <h3>Nothing planned yet</h3>
      <p>Pick what you want to cook this week and Mise totals every ingredient across all of it, then tells you what to buy.</p>
      <button class="btn btn-primary" id="planBrowse" style="margin-top:20px;max-width:280px">Browse recipes</button>
    </div>`;
    $('#planBrowse').onclick = () => setTab('recipes');
    return;
  }

  const needs = planTotals(state.plan, state.recipes, state.aliases);
  const toBuy = needs.filter((n) => n.state === 'missing' || n.state === 'short');
  const cookedCount = entries.filter((x) => x.entry.cooked).length;

  let html = `
    <div class="summary-bar" style="padding-top:2px">
      <span class="pill">${entries.length} meal${entries.length === 1 ? '' : 's'}</span>
      ${cookedCount ? `<span class="pill" data-state="have">${cookedCount} cooked</span>` : ''}
      ${toBuy.length ? `<span class="pill" data-state="missing">${toBuy.length} to buy</span>` : `<span class="pill" data-state="have">nothing to buy</span>`}
    </div>

    <div class="section-head"><h2>This week</h2><span class="section-count">${entries.length}</span></div>
    <div class="rows">`;

  for (const { entry, recipe } of entries) {
    const pill = statusPill(recipe);
    html += `
      <div class="row ${entry.cooked ? 'is-checked' : ''}" data-state="${entry.cooked ? 'have' : pill.state}">
        <button class="check" data-plancook="${entry.id}" role="checkbox" aria-checked="${!!entry.cooked}" aria-label="${entry.cooked ? 'Mark not cooked' : 'Mark cooked'} ${esc(recipe.title)}">
          <span class="check-box">${ICON.check}</span>
        </button>
        <button class="row-main" data-planopen="${recipe.id}">
          <span class="row-name">${esc(recipe.title)}</span>
          <span class="row-sub">${entry.batches > 1 ? `${entry.batches} batches · ` : ''}${scaledServings(recipe) ? `${scaledServings(recipe) * entry.batches} servings` : `${recipe.ingredients.length} ingredients`}${scaleOf(recipe) !== 1 ? ` · ${formatQuantity(scaleOf(recipe))}× recipe` : ''}</span>
        </button>
        <div class="stepper stepper-compact">
          <button data-planbatch="-1" data-id="${entry.id}" aria-label="Fewer batches of ${esc(recipe.title)}">${ICON.minus}</button>
          <span class="stepper-value">${entry.batches}</span>
          <button data-planbatch="1" data-id="${entry.id}" aria-label="More batches of ${esc(recipe.title)}">${ICON.plus}</button>
        </div>
      </div>`;
  }
  html += `</div>`;

  if (toBuy.length) {
    html += `
      <div class="section-head"><h2>Still need</h2><span class="section-count">${toBuy.length}</span></div>
      <div class="rows">`;
    for (const n of toBuy) {
      const shortfall = n.shortfall != null ? `${formatQuantity(n.shortfall)} ${unitLabel(n.unit)}`.trim() : '';
      const across = n.usedBy.length > 1 ? ` · for ${n.usedBy.length} recipes` : '';
      html += `
        <div class="row" data-state="${n.state}">
          <div class="row-main" style="cursor:default">
            <span class="row-name">${esc(n.name)}</span>
            <span class="row-sub">need ${esc(formatQuantity(n.needed))} ${esc(unitLabel(n.unit))}${n.have ? `, have ${esc(formatQuantity(n.have))}` : ''}${esc(across)}</span>
          </div>
          <span class="pill" data-state="${n.state}" style="margin-right:14px">${shortfall ? esc('+' + shortfall) : STATE_LABEL[n.state]}</span>
        </div>`;
    }
    html += `</div>
      <div class="toolbar" style="padding-top:14px">
        <button class="btn btn-primary" id="planToList" style="flex:1">Add ${toBuy.length} to shopping list</button>
      </div>`;
  } else {
    html += `<div class="empty" style="padding:34px 40px">
      <h3>You have everything</h3>
      <p>Every ingredient for this week is already at home.</p>
    </div>`;
  }

  const enough = needs.filter((n) => n.state === 'have').length;
  html += `<p class="hint" style="padding:4px 20px 0">Totalled across every meal — ${enough} ingredient${enough === 1 ? '' : 's'} covered by what's at home.</p>
    <div class="toolbar" style="padding-top:14px">
      <button class="btn" id="planClear" style="flex:1">Clear the week</button>
    </div>`;

  view.innerHTML = html;

  view.querySelectorAll('[data-planbatch]').forEach((b) => {
    b.onclick = () => {
      const entry = state.plan.find((p) => p.id === b.dataset.id);
      if (!entry) return;
      entry.batches = Math.max(1, (entry.batches || 1) + Number(b.dataset.planbatch));
      save();
      renderPlan();
    };
  });

  view.querySelectorAll('[data-planopen]').forEach((b) => {
    b.onclick = () => { recipeOpenId = b.dataset.planopen; setTab('recipes'); };
  });

  view.querySelectorAll('[data-plancook]').forEach((b) => {
    b.onclick = () => {
      const entry = state.plan.find((p) => p.id === b.dataset.plancook);
      if (!entry) return;
      entry.cooked = !entry.cooked;
      save();
      render(); // not renderPlan — the tab badge counts uncooked meals
      if (entry.cooked) {
        const recipe = state.recipes.find((r) => r.id === entry.recipeId);
        if (recipe) toast(`${recipe.title} cooked`, 'Update pantry', () => openMadeIt(recipe));
      }
    };
  });

  const toList = $('#planToList');
  if (toList) toList.onclick = () => {
    let added = 0;
    for (const n of toBuy) {
      if (state.list.some((i) => !i.checked && i.nameKey === n.key)) continue;
      state.list.push({
        id: uid(), name: n.name, nameKey: n.key,
        quantity: n.shortfall != null ? n.shortfall : null,
        unit: n.unit, note: null, category: guessCategory(n.name),
        checked: false, checkedAt: null, sourceRecipeId: null, addedAt: Date.now(),
      });
      added++;
    }
    save();
    render();
    toast(added ? `Added ${added} item${added === 1 ? '' : 's'}` : 'Already on your list', 'View', () => setTab('list'));
  };

  $('#planClear').onclick = () => {
    const undo = state.plan;
    state.plan = [];
    save();
    render();
    toast('Week cleared', 'Undo', () => { state.plan = undo; save(); render(); });
  };
}

/* ══════════════════════════════════════════════════════════════════════
   COOK MODE
   ══════════════════════════════════════════════════════════════════════ */
let cook = { recipeId: null, index: 0, timerEnd: null, tick: null, wakeLock: null };

async function openCook(recipeId) {
  const r = state.recipes.find((x) => x.id === recipeId);
  if (!r || !r.steps.length) { toast('This recipe has no steps yet.'); return; }
  cook.recipeId = recipeId;
  cook.index = 0;
  $('#cook').hidden = false;
  renderCook();
  // Keep the screen awake mid-recipe where supported.
  try {
    if ('wakeLock' in navigator) cook.wakeLock = await navigator.wakeLock.request('screen');
  } catch { /* not critical */ }
}

function closeCook() {
  stopTimer();
  $('#cook').hidden = true;
  if (cook.wakeLock) { cook.wakeLock.release().catch(() => {}); cook.wakeLock = null; }
  cook.recipeId = null;
}

function renderCook() {
  const r = state.recipes.find((x) => x.id === cook.recipeId);
  if (!r) return closeCook();
  const step = r.steps[cook.index];
  const progress = (cook.index + 1) / r.steps.length;

  const peek = scaledIngredients(r).map((ing) =>
    `<li><span>${esc(ing.name)}</span><span class="peek-qty">${esc(qtyLabel(ing.quantity, ing.unit))}</span></li>`
  ).join('');

  $('#cook').innerHTML = `
    <div class="cook-head">
      <span class="cook-progress">Step ${cook.index + 1} of ${r.steps.length}</span>
      <button class="linkish" id="cookExit">Done</button>
    </div>
    <div class="cook-track"><div class="cook-fill" style="transform:scaleX(${progress})"></div></div>
    <div class="cook-body">
      <p class="cook-step">${esc(step.text)}</p>
      ${step.timerSeconds ? `<button class="cook-timer" id="cookTimer">${timerFace(step.timerSeconds)}</button>` : ''}
    </div>
    <details class="cook-peek">
      <summary>Ingredients</summary>
      <ul class="peek-list">${peek}</ul>
    </details>
    <div class="cook-foot">
      <button class="btn" id="cookBack" ${cook.index === 0 ? 'disabled' : ''}>Back</button>
      <button class="btn btn-primary" id="cookNext">${cook.index === r.steps.length - 1 ? 'Finish' : 'Next'}</button>
    </div>`;

  $('#cookExit').onclick = closeCook;
  $('#cookBack').onclick = () => { if (cook.index > 0) { stopTimer(); cook.index--; renderCook(); } };
  $('#cookNext').onclick = () => {
    if (cook.index === r.steps.length - 1) {
      closeCook();
      // Finishing is the natural moment to update what's left at home.
      toast(`Finished ${r.title}`, 'Update pantry', () => openMadeIt(r));
      return;
    }
    stopTimer();
    cook.index++;
    renderCook();
  };

  const t = $('#cookTimer');
  if (t) t.onclick = () => (cook.timerEnd ? stopTimer(true) : startTimer(step.timerSeconds));
}

function timerFace(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

function startTimer(seconds) {
  cook.timerEnd = Date.now() + seconds * 1000;
  const btn = $('#cookTimer');
  if (btn) btn.classList.add('is-running');
  cook.tick = setInterval(() => {
    const left = Math.max(0, Math.round((cook.timerEnd - Date.now()) / 1000));
    const b = $('#cookTimer');
    if (b) b.textContent = timerFace(left);
    if (left <= 0) {
      stopTimer();
      if (navigator.vibrate) navigator.vibrate([220, 120, 220]);
      toast('Timer done');
    }
  }, 250);
}

function stopTimer(reset) {
  clearInterval(cook.tick);
  cook.tick = null;
  cook.timerEnd = null;
  const btn = $('#cookTimer');
  if (btn) {
    btn.classList.remove('is-running');
    if (reset) {
      const r = state.recipes.find((x) => x.id === cook.recipeId);
      const step = r && r.steps[cook.index];
      if (step && step.timerSeconds) btn.textContent = timerFace(step.timerSeconds);
    }
  }
}

/* ══════════════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════════════ */
function render() {
  if (currentTab === 'pantry') renderPantry();
  else if (currentTab === 'list') renderList();
  else if (currentTab === 'plan') renderPlan();
  else renderRecipes();

  const toBuy = state.list.filter((i) => !i.checked).length;
  const listBadge = $('#listBadge');
  listBadge.textContent = toBuy;
  listBadge.hidden = toBuy === 0;

  const planned = state.plan.filter((p) => !p.cooked).length;
  const planBadge = $('#planBadge');
  planBadge.textContent = planned;
  planBadge.hidden = planned === 0;
}

purgeOldChecked();
render();
updateStorageAlarm();
requestDurableStorage();

document.getElementById('alarmAction').onclick = openSettings;
</script>
